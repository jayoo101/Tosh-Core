[profile.default]
src     = "src"
out     = "out"
libs    = ["lib"]
solc    = "0.8.26"
via_ir  = true
optimizer = true
optimizer_runs = 200

# Pinned, not inherited. `ToshLadderTreasury`'s reentrancy mutex is a hand-rolled
# `tstore`/`tload` pair, so Cancun is a correctness requirement rather than a
# default worth drifting on — and it was previously only true because 0.8.26
# happens to default to it.
#
# Verified on the deployment target by execution, not by hardfork name. A fork
# test cannot establish this — forking borrows a chain's STATE and runs it on
# the local EVM at whatever `evm_version` says, so `ToshV5ForkBsc.t.sol` passing
# proves nothing about what chain 56 itself executes. The probe that does is an
# `eth_call` against a BSC node with a state override planting
# `0x60075f5d5f5c5f5260205ff3` — tstore(0,7), then return tload(0). BNB Smart
# Chain mainnet returns 7, so TSTORE/TLOAD round-trip there.
#
# Re-run that probe before adding a chain. Uniswap V4 being deployed and busy is
# strong corroboration (the PoolManager's lock and delta accounting are transient
# storage, so V4 cannot function without EIP-1153) but it is inference, and this
# line is cheap to check directly.
evm_version = "cancun"

# ---------------------------------------------------------------------------
# Remappings — pinned, and auto-detection off, because this list is CONSENSUS
# DATA rather than a build convenience.
#
# solc records `settings.remappings` in the contract metadata and appends that
# metadata's hash to the creation code. Auto-detection derives the list by
# scanning `lib/`, so the list — and therefore the last 32 bytes of every
# contract this repository deploys — depended on which nested submodules
# happened to be initialised on the machine doing the build.
#
# That is not theoretical. It shipped: this repo's tree had permit2,
# erc4626-tests and halmos-cheatcodes present as empty directories, so a local
# build detected 12 remappings while CI's `submodules: recursive` checkout
# detected 15. Identical sources (all 44 hashes matched), identical compiler,
# identical settings, byte-identical executable code — and a different hook
# implementation address, because CREATE2 hashes the whole creation code and
# the metadata hash is part of it.
#
# Be precise about what that costs, because the first version of this comment
# was not. It does NOT break launching: the launch page reads
# `factory.hookInitcodeHash(...)` off the chain and mines against the answer,
# so it tracks whatever factory is deployed. What it breaks is verification —
# a clean clone does not rebuild what was deployed, which is the tree an
# auditor builds and the tree Blockscout compares against.
#
# So: every prefix any compiled source imports, listed here and nowhere else.
# Derived by scanning imports across src, test, script and the vendored trees,
# not by copying what auto-detection happened to produce. `permit2/` resolves
# to a submodule this repo does not initialise; it is listed because nothing
# reachable imports it and the STRING still has to be identical everywhere.
#
# Adding a dependency means adding its prefix here, and that changes the
# metadata hash, and so the deployed address of any contract CREATE2'd from it.
# Re-verify and re-publish the initcode hash (PM-C6) in the same change.
# Nothing fails loudly if you do not — that is precisely why it is written here.
#
# ── The Infinity entries, and the measurement behind them ──────────────────
#
# The paragraph above is now backed by a number rather than an argument.
# Adding ONE entry — `infinity-core/`, imported by no production file at the
# time — moved `ToshLaunchpadHook`'s creation code from SHA-256 `4B960B60…`
# to `31E9D55C…`. There is no such thing as a locally-scoped remapping: solc
# records the whole list, used or not.
#
# So the two Infinity prefixes were added exactly once, deliberately, in the
# same change that deletes the address miner — because that change moves every
# CREATE2 address anyway, and paying for it twice would be the avoidable
# mistake. Infinity derives hook permissions from a bitmap in `PoolKey.parameters`
# instead of the hook's address bits, so there is no mined address left to
# invalidate. See docs/PANCAKESWAP_INFINITY.md §3.3 and §3.4.
#
# `infinity-periphery/` is what forces the issue: unlike core, it cannot be
# reached by relative path, because its own sources import core through the
# `infinity-core/` prefix.
# ---------------------------------------------------------------------------
auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "ds-test/=lib/v4-core/lib/forge-std/lib/ds-test/src/",
    "forge-std/=lib/forge-std/src/",
    "infinity-core/=lib/infinity-core/",
    "infinity-periphery/=lib/infinity-periphery/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "permit2/=lib/v4-periphery/lib/permit2/",
    "solmate/=lib/v4-core/lib/solmate/",
]

# Cheatcode FS permissions.
#
# `DeployV2.s.sol` writes its address book to `./deployments/v2-<chainid>.json`.
# Nothing reads the tree, so nothing else is granted.
fs_permissions = [
    { access = "read-write", path = "./deployments" },
]

[profile.default.fuzz]
runs = 256

# ---------------------------------------------------------------------------
# Stateful invariants (test/v2/LifecycleInvariant.t.sol, test/v2/BidBookInvariant.t.sol)
#
# `fail_on_revert = false` is required, not a concession: the handler drives a
# real state machine, so a random sequence legitimately hits phase guards
# (`GenesisExpired`, `NotLaunched`, `AlreadyLaunched`) on most calls. Failing on
# those would reduce every run to its first revert.
#
# The cost of that setting is that a suite where *everything* reverted would
# report a pass. That is guarded by the deterministic `test_handler*` tests in
# the same file, NOT by `afterInvariant()` — an assertion there sends Foundry
# into shrinking, and the minimal sequence it converges on has no activity
# either, so the report names the wrong problem. `afterInvariant()` only logs.
#
# `depth` is the knob that matters here. A genesis window is 3–72 h and the
# launch window is another 7 days, and the handler warps at most 4 days per
# call — so a shallow run can never reach the refund or zombie phases at all,
# and the refund invariants would be vacuously true. Depth also has to be
# enough to reach a *funded* treasury: the buyback invariants need a launched
# pool, a listed ladder token and a full `TRIGGER_STEP` of accumulated tax
# (10 BEM) before anything can leave, which is several actions deep past launch.
#
# depth stays 100 HERE, and the deeper setting lives in `.github/workflows/
# soak.yml` instead. It was raised to 250 on 2026-09-06 and moved back out the
# same day, for a reason worth keeping: CI runs this suite twice, plain and
# --isolate, so depth 250 took CI from 7m27s to 13m12s — nearly double, on every
# push. The repository is public now and those minutes are free, but the time
# is still paid in review latency: a 13-minute signal on every push is worse
# than a 7-minute one plus a daily soak. The depth evidence below is real and
# the knee is genuinely 250; what it does not justify is waiting for it on
# every push.
#
# Everything from here to the end of this block is the measurement, kept because
# it is the argument for what soak.yml runs. Measured 2026-09,
# measured on `invariant_treasuryOutflowAlwaysBurns` at runs=64, one sample per
# depth, reading afterInvariant()'s counters:
#
#   depth  100    250    500   1000      wall (64 runs)
#   buys     5     25     35     75      3.1s  5.9s  12.1s  26.4s
#   sells    1     11     15     38
#   deposits 10     13      8      5
#
# 250 is the knee: it is the last depth that improves post-launch composition
# WITHOUT costing genesis composition. Past it, deposits fall away — deeper runs
# spend proportionally more of their calls after the genesis windows have expired,
# so depth trades genesis coverage for post-launch coverage rather than adding
# coverage outright. That trade is the reason this is 250 and not 2500; the soak
# itself ran at 2500 and is not what CI should carry.
#
# Read the numbers above as one sample each, not as suite properties:
# afterInvariant() logs the LAST run only. §5.19 records three wrong conclusions
# drawn from exactly that confusion in the course of choosing this value.
#
# Cost, measured on the whole contract at the real runs=128 rather than
# extrapolated from the runs=64 probe: 7.8s -> 39.5s locally. That is ~5x, not
# the ~2x the single-invariant probe above suggests, because the probe timed one
# invariant and the suite runs nine plus five unit tests, so it saturates the
# available cores differently.
#
# The number that actually mattered is CI, which runs the whole suite TWICE
# (plain and --isolate) on a slower runner: 7m27s at depth 100 -> 13m12s at
# depth 250, measured across consecutive pushes. That measurement is what sent
# the deep setting to soak.yml and left this line at 100. The local delta was
# 31.7s and would have made the change look free.
# ---------------------------------------------------------------------------
[profile.default.invariant]
runs = 128
depth = 100
fail_on_revert = false
call_override = false
shrink_run_limit = 2000

# ---------------------------------------------------------------------------
# Linting
#
# `forge lint` runs on every build by default, and its advisory output is long
# enough to push real compiler errors off the top of the scrollback. It stays
# available as an explicit audit step (`forge lint`), just detached from the
# build signal.
#
# The two rules it fires on in this codebase are benign by construction:
#   block-timestamp — every comparison is against a 24h genesis deadline or a
#                     7-day launch window; a validator's few-second drift
#                     cannot move either one meaningfully.
#   unsafe-typecast — each remaining cast is range-checked by its own caller
#                     (`out > 0`, `d0 < 0`, `span > 0`) or bounded by V4's
#                     int128 delta accounting. The one cast that genuinely fed
#                     flash accounting now goes through `SafeCast.toInt128`.
# ---------------------------------------------------------------------------
[lint]
lint_on_build = false

# ---------------------------------------------------------------------------
# Coverage
#
# `forge coverage` hard-overrides any profile-level `via_ir` / `optimizer`
# settings (it deliberately disables them "for accurate coverage reports"),
# so a `[profile.coverage]` section here would be silently ignored.
#
# Because this project's contracts hit "stack too deep" without viaIR, the
# only way to make coverage compile is the CLI flag `--ir-minimum`. Use the
# wrapper script:
#
#   ./scripts/coverage.ps1                 # summary table
#   ./scripts/coverage.ps1 -Report lcov    # lcov.info for editors / CI
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Network RPC endpoints (values read from .env via ${VAR} interpolation)
# ---------------------------------------------------------------------------
#
# `bsc` is the production target (chain 56). It serves `test/v2/ForkV2Bsc.t.sol`
# and `test/ToshV5ForkInfinity.t.sol`, both of which read `BSC_RPC` directly
# rather than by alias.
#
# `bsc_testnet` (97) is where the rehearsal actually runs, against the deployed
# factory. This paragraph used to say the opposite — that 97 could not host a
# rehearsal because Uniswap V4 is not deployed there, so the lifecycle had to be
# driven against `anvil --fork-url $BSC_RPC`, and that the devnet was therefore
# the frontend's default chain. Every clause of that was made false by the move
# to PancakeSwap Infinity, which IS deployed on 97: the full lifecycle ran on the
# real chain there, and the frontend's default is 97. The V4/97 gap is in fact
# why Infinity was chosen; see docs/PANCAKESWAP_INFINITY.md §2.
#
# A public BSC endpoint is fine for forking but not for indexing: the dataseed
# nodes reject a 9,000-block `eth_getLogs` span. `BSC_RPC` wants a keyed
# provider before anything indexes against it.
# ---------------------------------------------------------------------------
[rpc_endpoints]
bsc               = "${BSC_RPC}"
bsc_testnet       = "${BSC_TESTNET_RPC}"
anvil             = "http://127.0.0.1:8545"

# ---------------------------------------------------------------------------
# Contract verification
#
# Both BSC chains verify through Etherscan v2's multichain host on ONE key, so
# `bsc` and `bsc_testnet` differ only in the chain they name. These entries need
# no `--verifier` flag; Etherscan is Foundry's default.
#
# ⚠ `?chainid=` IN THE URL IS NOT BELT-AND-BRACES WITH `chain =`. Foundry 1.7.1
#   does not append v2's chain selector to a URL given here, so without the
#   query parameter every request to this host comes back
#
#       Missing chainid parameter (required for v2 api)
#
#   even though `chain` is set two fields to the right. Measured twice while
#   getting `.github/workflows/verify.yml` working: once on a verification
#   submission, and once on the ABI lookup that Foundry performs even when the
#   verifier is Sourcify and Etherscan is not being submitted to at all.
#
#   So `chain` and the query parameter answer to different consumers and both
#   are load-bearing. Deleting the duplication is a two-line change that breaks
#   verification on both BSC chains with an error that names neither.
#
# Queried from `api.etherscan.io/v2/chainlist` rather than assumed — 56 and 97
# are both listed, as bscscan.com and testnet.bscscan.com.
#
# ---------------------------------------------------------------------------
[etherscan]
bsc               = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=56", chain = 56    }
bsc_testnet       = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=97", chain = 97    }
