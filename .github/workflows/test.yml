name: CI

permissions: {}

on:
  push:
    # `watcher-state` carries one generated file: the block checkpoint that
    # watch.yml pushes on every pass. Without this exclusion each push would
    # start a full Foundry build, both test runs and every guard below — twice
    # an hour, on a branch with no Solidity on it.
    branches-ignore: [watcher-state]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      # Pinned. The default is `stable`, resolved at run time, so both the
      # formatter and the gas accounting can change on a day nobody touched
      # this repository — a red check with no commit behind it.
      #
      # Not hypothetical: the first run of this workflow failed `forge fmt
      # --check` under 1.8.1 on a tree 1.7.1 formats clean. The isolated-gas
      # step below is the sharper edge, since it holds real gas figures against
      # constants and a version bump can move them.
      #
      # 1.7.1 is what the contracts were written and tested against. Raising it
      # is a deliberate change: run the suite locally on the new version first.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      # `--skip` keeps the size gate aimed at contracts that get deployed.
      # Without it the step fails on CloneDeployer — a 27 KB helper in
      # ToshHookClone.t.sol that exists to deploy hook clones and never reaches
      # a chain. That is not a harmless false positive: the step reports one
      # pass/fail for the whole tree, so a single over-limit test contract
      # masks the gate for every contract it was built to protect.
      #
      # Headroom on what actually ships, measured when this was pinned:
      # hook 3,978 B, factory 13,910 B, treasury 18,541 B, token 20,373 B.
      # The hook is at 84% of EIP-170 and is the one that will hit the wall.
      - name: Run Forge build
        run: forge build --sizes --skip '*.t.sol'

      - name: Run Forge tests
        run: |
          set -euo pipefail
          forge test -vvv | tee /tmp/forge-plain.log

      # Again with per-call gas accounting. `forge test` bills a whole test as
      # one transaction, so storage a test touched in setup stays warm and every
      # later call looks cheaper than it would on chain; `--isolate` charges each
      # call the way a real transaction would.
      #
      # Not redundant. Two bugs reached this repo that only this run catches: a
      # clone funded with `transfer()`, whose 2300-gas stipend cannot cover the
      # proxy's delegatecall, and the piggyback gas gate, whose whole purpose is
      # to compare a real gas figure against a constant. Both passed plain.
      - name: Run Forge tests (isolated gas accounting)
        run: |
          set -euo pipefail
          forge test --isolate -vvv | tee /tmp/forge-isolate.log

      # A green `forge test` is not by itself evidence that the tests ran.
      #
      # Found the hard way: a build interrupted partway leaves an artifact whose
      # ABI is complete but whose `bytecode.object` is empty. Forge cannot deploy
      # that contract, so it reports "no tests found" FOR THAT SUITE and moves
      # on — and because the suites that did run all passed, the step exits 0.
      # `forge build` then says "no files changed" and rebuilds nothing, so the
      # state is sticky. The observed symptom was 336 tests becoming 256, still
      # green, with the entire main suite gone and nothing in the log to say so.
      # `forge build --force` is the recovery.
      #
      # Two independent assertions, because they fail on different things. The
      # floor catches a suite vanishing; the agreement check catches it vanishing
      # from only one of the two runs, which is the shape a caching fault takes.
      #
      # RAISE THE FLOOR when you add tests. Lowering it is the same act as
      # deleting a test and should be as visible in review.
      #
      # 336 -> 335 on 2026-09-03: `test_hookBytecode_inSyncWithArtifact` was
      # deleted with the constant it pinned, which nothing imported. See
      # a checklist item that used to name the same deletion. This guard is the counter-example to that
      # one — it caught the deletion on the first push and said what to do about
      # it, because it measures the suite rather than restating it.
      #
      # 335 -> 349 on 2026-09-04. Not a rule change: the floor had simply been
      # left 14 below the suite while the dark-tax and PLATFORM_TREASURY tests
      # landed, so it would no longer have caught the deletion it was written
      # for. A floor that trails the suite is a floor that has stopped working.
      #
      # The floor is safe WITHOUT the fork secret, which is the state this
      # repository is in. Measured rather than assumed: forge counts a
      # `vm.skip`'d test in its "(N total tests)" summary (probed with a
      # two-test contract, one skipping — forge reported "1 passed; 0 failed;
      # 1 skipped (2 total tests)"). So the 8 fork tests that skip here still
      # count, and the number this step reads is the same either way.
      #
      # 349 -> 350 on 2026-09-04:
      # `test_piggyback_innerMutexHoldsAgainstAReentrantLadderHook`, which
      # closes the coverage gap a 2026-09 sweep had recorded against
      # itself — `_runPiggyback`'s own mutex check was reached by no test.
      #
      # 350 -> 351 on 2026-09-05:
      # `test_smallestReachableShelfP0_stillStepsTheLadder`, from the §5.11
      # ladder-pricing sweep. Shelf monotonicity has a break-even at a base of
      # 526 wei and three independently retunable constants decide whether the
      # system can reach it; nothing linked them.
      #
      # 351 -> 354 on 2026-09-05:
      # `test_setLaunchFee_atBoundary`, `_rejectsAboveCeiling` and
      # `_rejectsOrderOfMagnitudeSlip`, from the §5.14 settings sweep.
      # `setLaunchFee` was the one setter on the factory with no validation of
      # any kind; it is now bounded by `MAX_LAUNCH_FEE`.
      #
      # 354 -> 362 on 2026-09-05: the eight boundary and unit-slip tests §5.15
      # added for `setDefaultSoftCap` and `setMaxPogAllocationLimit`. The floor
      # was not raised with them, so for a day it sat exactly 8 below the suite
      # — which is the same failure the 335 -> 349 entry above describes, and
      # the amount it had drifted was precisely the block of tests most likely
      # to be deleted together. The frontend floor in `frontend.yml` was raised
      # to 188 in the same commit; this one was missed, which is the argument
      # for reading both numbers off a run rather than off the diff.
      #
      # 362 -> 363 on 2026-09-06: `test_handlerCanReachMintShelf`. The retail
      # buy (`mintBondingCurve`) had no invariant action; the UI never talks to
      # the V4 router, so the shelf's price gates and same-block lockout were
      # composed against nothing.
      #
      # 363 -> 367 on 2026-09-11: the four tests in
      # `ToshV5FirstLaunchRehearsal.t.sol`, which take the whole lifecycle
      # through the deployed factory at the 0.01 ETH production floor. Every
      # other suite that reaches genesis does it at 1 ETH or above, so the
      # planned first mainnet launch would have been the floor's first
      # execution anywhere.
      #
      # These four skip on this runner, and the count is unchanged by that --
      # see the note above on `vm.skip`'d tests still appearing in the total.
      # They are not in the live-V4 step either, which selects on
      # `--match-contract ToshV5ForkTest`. So the floor is the only thing here
      # that notices if they are deleted, which is the argument for raising it
      # in the same commit rather than leaving four tests below an unmoved one.
      #
      # 367 -> 373 on 2026-09-13: the six `test_projectReferral_*` /
      # `test_referralSplit_*` / `test_canBindProjectReferral_*` tests in
      # `ToshV5.t.sol`, which cover the per-project referral carve and the
      # truncation case where the two slots must still sum to it. Found by
      # audit, not by CI: the floor had sat at 367 against a suite of 373, so
      # six tests could have been deleted without turning anything red. In the
      # same window `test_probeG3_immatureTwapLeavesTheBuybackUnbounded` became
      # `test_probeG3_immatureTwapIsRefusedAtListing` when the TWAP gate reached
      # chain, which is a rename and moves the count by nothing.
      #
      # 373 -> 405 on 2026-09-21, found by the pre-mainnet sweep and not by this
      # step. 32 adrift, across the `ladderViable` refund door, the immediate-
      # refund tests and the settings work — so the tests covering the newest
      # money path on the contract were the ones this floor had stopped
      # protecting.
      #
      # Read off `forge test` with no `--match` or `--no-match`: 401 passed and
      # 4 skipped, 405 collected. The 4 are the fork tests that skip without a
      # chain-56 endpoint, and per the note above a `vm.skip`'d test still
      # appears in forge's total, so 405 is the figure on this runner with or
      # without `BSC_RPC`.
      #
      # The frontend floor in `frontend.yml` was 58 adrift in the same sweep and
      # was raised in the same commit. See the note there: two independent
      # floors both left to rot is the argument for computing the drift in CI
      # rather than asking a reader to remember.
      #
      # 405 -> 407 the same day: `test_requireMainnetTarget_refusesTestnet` and
      # `_acceptsMainnet`. `DeployMainnet.s.sol` checked that the RPC agreed with
      # `TARGET_CHAIN_ID` and never that either named mainnet, so the mainnet
      # script would broadcast to 97 on a restored `.env` with every check green.
      #
      # They drive `requireMainnetTarget(uint256)` directly rather than `run()`,
      # and that is not stylistic: reaching the branch through `run()` needs
      # `vm.setEnv`, which writes the process environment, which is outside the
      # state Forge snapshots. Measured — one env-based test leaked 97 into four
      # others, and restoring the value on the next line still left two red.
      #
      # 407 -> 408: `test_probeA2_launchBlockPoolFlowIsOpenByDesign`. The launch
      # block shuts the shelf and not the pool, which is deliberate, and probe A
      # pinning `SameBlockMintForbidden` reads as though it covered both. A2 pins
      # the pool side explicitly: the buy succeeds, and it does not undercut `p0`.
      #
      # 408 -> 410: `test_run_refusesAVaultThatTheManagerDoesNotClaim` and
      # `_refusesAManagerThatIsNotAManager`. `INFINITY_CL_POOL_MANAGER` and
      # `INFINITY_VAULT` are two variables naming one pair, both immutable on the
      # factory and on every hook it clones, and the script asked a HUMAN to check
      # the pairing — on the grounds that "the script cannot", which was untrue:
      # it runs against `--rpc-url` and the manager publishes `vault()`. A
      # mismatch deploys a clean factory whose every `createLaunch` reverts, with
      # no setter to fix it.
      #
      # These use `vm.mockCall`, not `vm.setEnv`, for the reason the note above
      # gives: mocks are cleared between tests, environment writes are not.
      #
      # 410 -> 412: `invariant_promisedCommissionIsPayable` and its deterministic
      # companion `test_referralPromiseCoverageIsLive`. The `claimReferral` action
      # has always been in the invariant handler and has always picked an actor
      # that HOLDS commission, then wrapped the call in `catch {}` — so a hook
      # whose `referralAccrued` had outrun the quote it holds was indistinguishable
      # from a run where the fuzzer drew unlucky actors. No assertion, no red.
      #
      # The pair is not stylistic. Forge evaluates invariants once after `setUp`,
      # so a coverage assertion inside the invariant fails at `runs: 0` and reads
      # as broken plumbing; and `afterInvariant` is worse, because a failure there
      # starts shrinking and the minimal sequence has no coverage either. Coverage
      # therefore lives in a plain test, which is the division this file's own
      # `test_handlerPlumbingIsLive` note already argued for.
      #
      # 415 -> 417: probes O and N, the two coverage gaps a 2026-09 sweep had
      # recorded against itself — JIT liquidity and the price boundary. Lettered O
      # rather than M because `test_probeM_launchBlockLockIsRaiseDependent` already
      # holds M; `test_probeD_` is genuinely used twice and is left alone.
      #
      # O asks whether `MAX_LEG_DEPTH_BPS` is self-defeating, since it sizes the
      # leg off `getLiquidity()` and `beforeAddLiquidity` is a `pure` no-op, so the
      # quantity it reads is attacker-supplied. It is not, and the measurement is
      # the point: a dominant JIT position raises the ceiling 5x (70.17 -> 350.85
      # BEM) and moves what a BEM buys by 0.025 %, because raising the liquidity
      # raises the leg and the depth that leg swaps through by the same factor. The
      # probe asserts the BURN RATE, not the attacker's P&L, which is positive for
      # a reason unrelated to the treasury — see the probe.
      #
      # N walks spot out to tick 537_327 and pins what the treasury does there.
      # `getLiquidity()` never reaches zero on the way out (one full-range position
      # has the same liquidity at every tick inside it), so the boundary shows up
      # as the RATIO collapsing: `legCeiling` falls to 19_837 base units and the
      # leg spends exactly that, 0.0002 BEM against an offer of 333.
      - name: Assert the suite did not silently shrink
        run: |
          set -euo pipefail
          # 429 as of the invariant gap-review work: three new invariants
          # (launched-hook commission solvency, referral ledger agreement,
          # deposit-slot totals), two more from the second pass (phase-2 supply
          # identity, quota view vs storage), two promise invariants for genesis
          # and refund liveness, and five reachability tests that keep the new
          # ghosts from being vacuously clean.
          floor=429

          read_count() {
            grep -oE '\(([0-9]+) total tests\)' "$1" | tail -1 | grep -oE '[0-9]+'
          }

          plain=$(read_count /tmp/forge-plain.log || true)
          isolate=$(read_count /tmp/forge-isolate.log || true)

          if [ -z "$plain" ] || [ -z "$isolate" ]; then
            echo "::error::Could not read a test count from forge's summary line. The output format changed, or a run did not finish."
            exit 1
          fi

          echo "plain=$plain isolate=$isolate floor=$floor"

          if [ "$plain" != "$isolate" ]; then
            echo "::error::The two runs disagree on how many tests exist ($plain vs $isolate). Same tree, same tests — a difference means one run did not see a suite. Try 'forge build --force'."
            exit 1
          fi

          if [ "$plain" -lt "$floor" ]; then
            echo "::error::$plain tests ran, below the floor of $floor. A suite is missing rather than failing. If tests were deliberately removed, lower the floor in this workflow in the same commit and say why."
            exit 1
          fi

          # ── And the direction that let this floor rot 32 tests adrift ────────
          #
          # A floor catches a shrinking suite and says nothing about a growing
          # one, so every addition widened the gap in silence until the number
          # guarded nothing. Same check, same reasoning and the same `slack` as
          # `frontend.yml`; the two floors decayed together and are repaired
          # together, because a lesson applied to one of a matched pair is how
          # this drifted the second time.
          slack=8
          ceiling=$(( floor + slack ))
          if [ "$plain" -gt "$ceiling" ]; then
            echo "::error::$plain tests ran against a floor of $floor (slack $slack). The suite has grown and the floor has not, which is how it previously drifted 32 tests adrift and stopped guarding anything. Raise floor to $plain in this workflow, in this commit, with a line saying what was added."
            exit 1
          fi

      # Fork tests against the PancakeSwap Infinity CL manager and Vault that are
      # actually deployed on BNB Smart Chain (56). Every run above this uses a
      # manager and Vault compiled from `lib/infinity-core` — the same source, but
      # never the same bytecode and never the same surrounding state. See
      # test/ToshV5Fork.t.sol.
      #
      # ⚠ THIS STEP PASSED `ROBINHOOD_RPC` INTO SUITES THAT READ `BSC_RPC`, from
      #   the Infinity port until it was noticed. The three assertions below are
      #   what made that loud instead of silent: every test skipped for want of an
      #   endpoint name nothing supplied, so "0 passed" tripped the second check
      #   and the step went red. It went red with an error message telling the
      #   operator to set a chain-4663 endpoint, which was the one repair that
      #   could not work. Worth keeping as a note: the guard caught the symptom
      #   and the message sent the reader the wrong way, and only the first of
      #   those is automatable.
      #
      # Forks of this repository have no reason to carry a permanently red
      # check, and a check everyone has learned to ignore is worth less than no
      # check — so a missing `BSC_RPC` is tolerated THERE and only there.
      #
      # On the canonical repository it is a failure. An earlier version of this
      # step tolerated it everywhere, which meant the whole live-AMM suite could
      # stop running here — secret expired, secret never set, endpoint dead —
      # and CI stayed green, because "every test skipped" and "everything
      # passed" are the same exit code.
      #
      # Three assertions below, for three ways this goes quiet without going red:
      #
      #   • `--match-contract` against a name that matches nothing prints
      #     "No tests found in project!" and exits 0. Rename the contracts, or
      #     delete the files, and this step keeps reporting success forever.
      #   • A reachable-but-wrong RPC (rate-limited, 521) leaves `forked` false,
      #     so the fork guard skips every test and the suite still exits 0.
      #   • A PARTIAL skip is not a pass, and is the shape a half-configured
      #     environment takes.
      #
      # The secret must point at chain 56. It does NOT need to be archive-
      # capable: both suites are unpinned. Each asserts `block.chainid == 56`
      # itself, so a correct-looking endpoint for the wrong chain fails loudly
      # rather than passing against some other chain's AMM.
      #
      # All three fork contracts run here. `ToshV5ForkInfinityTest` was not in CI
      # at all before — it is the spike that proves the hook MECHANISM against the
      # deployed Vault, and it reads the same secret, so leaving it out meant a
      # suite that could only ever run on someone's laptop.
      # `ToshV5FirstLaunchRehearsalTest` was in the same position for the same
      # reason plus one more, an address nothing supplied; see the note below it.
      - name: Run fork tests against the live singleton and the live factory
        env:
          BSC_RPC: ${{ secrets.BSC_RPC }}
          REPO_IS_FORK: ${{ github.event.repository.fork }}
          PR_FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${BSC_RPC:-}" ]; then
            # Secrets are not exposed to pull requests raised from a fork, so a
            # community PR reaching here without one is expected, not broken.
            if [ "$REPO_IS_FORK" = "true" ] || [ "$PR_FROM_FORK" = "true" ]; then
              echo "::notice::BSC_RPC unavailable on a fork — skipping the live Infinity suites. This is expected; see .env.example."
              exit 0
            fi
            echo "::error::BSC_RPC is not set on the canonical repository, so the live Infinity fork suites did not run. Set the repository secret to a chain-56 endpoint. Do not silence this by deleting the step: it is the only check that runs against the CLPoolManager and Vault actually deployed on the production chain."
            exit 1
          fi

          # `ToshV5FirstLaunchRehearsal` needs the live FACTORY as well as an
          # endpoint, and it reads the address from the file monitoring already
          # treats as the record of what is deployed — not from a second secret
          # that can go unset, and not from a literal pinned here that a redeploy
          # would leave pointing at a retired factory.
          #
          # ⚠ THOSE FIVE TESTS HAD NEVER RUN ANYWHERE BUT A LAPTOP. `_requireFork`
          #   skips on an unset `BSC_FACTORY_ADDRESS`, nothing in CI set it, and the
          #   suite was not in `--match-contract` either — so the one suite that
          #   takes the whole lifecycle through the DEPLOYED factory was uncovered
          #   twice over. Pointed at chain 56 for the first time it failed three
          #   ways, and every one of them was a fact about the live chain that no
          #   locally-deployed factory could have shown:
          #
          #     • the modelled Safe step never raised `maxPogAllocationLimit`, which
          #       ships at 46.4 BEM — BELOW the 100 BEM `MIN_SOFT_CAP_PROD` — so a
          #       lone depositor could not fund the cap and `registerPoG` reverted
          #       `ExceedsGlobalPogLimit`. An operator would have met that revert on
          #       mainnet instead.
          #     • the pool's `currency0` was still expected to be native, three
          #       migrations after the quote asset became BEM.
          #     • `shelfP0` was pinned to the 18-decimal figure, which BEM's eight
          #       decimals had already moved by six orders of magnitude.
          if [ "$(jq -r '.chainId' monitoring/alerts.json)" != "56" ]; then
            echo "::error::monitoring/alerts.json no longer names chain 56, so the factory address in it must not be handed to a suite whose every other pinned address is a 56 literal. Point the rehearsal at the right file or stop deriving the address from this one."
            exit 1
          fi
          BSC_FACTORY_ADDRESS="$(jq -r '.addresses.factory' monitoring/alerts.json)"
          if [ -z "$BSC_FACTORY_ADDRESS" ] || [ "$BSC_FACTORY_ADDRESS" = "null" ]; then
            echo "::error::monitoring/alerts.json has no .addresses.factory, so ToshV5FirstLaunchRehearsalTest would skip and take the whole live-lifecycle coverage with it silently."
            exit 1
          fi
          export BSC_FACTORY_ADDRESS
          echo "Rehearsing the lifecycle against factory $BSC_FACTORY_ADDRESS"

          # Deliberately outside the working tree: the artifact-sync step below
          # fails on any unexpected file, and a log dropped in the repo root
          # would trip it.
          log="$RUNNER_TEMP/fork-test.log"
          forge test --match-contract 'ToshV5ForkTest|ToshV5ForkInfinityTest|ToshV5FirstLaunchRehearsalTest' -vvv | tee "$log"

          if grep -q 'No tests found' "$log"; then
            echo "::error::--match-contract matched no fork contract. ToshV5ForkTest, ToshV5ForkInfinityTest or ToshV5FirstLaunchRehearsalTest was renamed or removed, and forge exits 0 on that, so this step would otherwise pass having run no tests."
            exit 1
          fi
          if ! grep -qE '[1-9][0-9]* (tests? )?passed' "$log"; then
            echo "::error::The fork suites ran but nothing passed. With BSC_RPC set this usually means setUp() could not reach the endpoint, so it never forked and every test skipped. Check that the value names chain 56 and not 97."
            exit 1
          fi
          if grep -qE '[1-9][0-9]* skipped' "$log"; then
            echo "::error::Some fork tests reported SKIPPED with BSC_RPC set. A partial skip is not a pass — see _requireFork in test/ToshV5Fork.t.sol, the onFork modifier in test/ToshV5ForkInfinity.t.sol, and _requireFork/_requireRpc in test/ToshV5FirstLaunchRehearsal.t.sol, which also needs the factory address derived above."
            exit 1
          fi

      # The frontend reads a checked-in copy of the ABIs. A Solidity change that
      # lands without re-running the extractor leaves the UI calling a signature
      # that no longer exists — a runtime revert with nothing to warn about it
      # at compile time. This job already has both Foundry and the fresh `out/`
      # artifacts, so the check is free here.
      - name: Check frontend artifacts are in sync
        run: |
          node scripts/extractAbis.js
          if ! git diff --exit-code --stat; then
            echo "::error::Frontend artifacts are stale. Run scripts/extractAbis.js, then commit the result."
            exit 1
          fi
          # `git diff` only sees TRACKED files. An extractor taught to write a
          # new path would emit it as untracked and this step would pass having
          # noticed nothing — the generated file simply never gets committed,
          # and the frontend reads a stale one forever.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The extractors produced a file git is not tracking:"
            git status --porcelain
            echo "::error::If that path is a new artifact, commit it. If it is incidental output, write it outside the working tree."
            exit 1
          fi

      # The launch UI mines CREATE2 salts in TypeScript against a byte layout it
      # has to reproduce exactly. Get one field's width wrong and the miner still
      # returns a well-formed salt — for a different initcode — so every
      # createLaunch from the UI reverts with `InvalidHookSalt` while both sides
      # compile and every Solidity test stays green.
      #
      # This guard existed before this step did and was RED: `softCap` was being
      # packed as 32 bytes against Solidity's `uint128`. Nothing ran it, which is
      # the only reason that shipped. See scripts/checkCloneInitcodeTuple.mjs.
      - name: Check frontend salt miner matches ToshCloneLib
        run: node scripts/checkCloneInitcodeTuple.mjs

      # The UniversalRouter on mainnet predates `lib/v4-periphery`, and
      # `IV4Router.ExactInputSingleParams` has since gained a field INSERTED
      # ahead of `hookData`. On a native-ETH pool with the new field left at
      # zero the deployed decoder does not revert — it silently reads `hookData`
      # as empty, because the offset it expects lands on `currency0`. Every Tosh
      # pool is native-ETH, so that is the shape this repository would hit.
      #
      # Nothing outside `test/` builds router calldata today, and this guard
      # pins that: it holds the fork test's hand-rolled tuple against the
      # deployed layout, requires the vendored one to still differ, and fails if
      # any non-test source starts encoding a swap. Needs `lib/`, so it belongs
      # in this job rather than frontend.yml, which checks out without
      # submodules. See scripts/checkV4RouterTuple.mjs.
      - name: Check V4 router calldata matches the deployed router
        run: node scripts/checkV4RouterTuple.mjs

      # The LP panel hand-encodes posm `modifyLiquidities` payloads, and posm
      # does not abi-decode them: `decodeCLMintParams` reads fields by hard-coded
      # calldata offsets. Bump this submodule so that a `PoolKey` field is
      # inserted, an offset moves, or an `Actions` opcode is renumbered, and
      # both sides still compile and every Solidity test still passes while
      # every deposit from the UI reverts with `SliceOutOfBounds` — or succeeds
      # having performed a different action than the button named.
      #
      # frontend.yml runs the other half of this pair, which drives the real
      # viem encoder and checks the bytes. That half can only compare them
      # against literals written in the guard; this half is what pins those
      # literals to `lib/infinity-periphery`, so it has to be here — frontend.yml
      # checks out without submodules. See scripts/checkLpActionsAbi.mjs.
      - name: Check posm payload layout matches vendored infinity-periphery
        run: node scripts/checkLpActionsAbi.mjs

      # The on-chain alert definitions key on event topic0 hashes. Rename an
      # event and every monitor built from them goes quiet — not erroring, just
      # never firing again, which is invisible because "no alerts" looks exactly
      # like "nothing wrong". This also fails when a NEW event is added without
      # anyone deciding whether it should page, since an unclassified event is
      # an unmonitored one. scripts/verifyAlertTopics.js is the check.
      - name: Check on-chain alert config matches the contracts
        run: node scripts/verifyAlertTopics.js

      # Grouping by address (and one address-less query) is what keeps a pass
      # under the public RPC's 7th-identical-call 429. A new alert that lands
      # in a fourth group, or a shared topic0 that gets OR-mixed across
      # contracts, re-opens the 2026-09-08 miss. This is offline.
      - name: Check watcher log queries stay under the public-RPC ceiling
        run: node monitoring/logQueries.test.mjs

      # The watcher files findings with a PAT whose expiry GitHub will not
      # tell us. The dates are hand-kept files; this step fails inside 21 days
      # so a push goes red before a cron does. Rotate the PAT and rewrite its
      # date file in the same commit.
      #
      # Two tokens, and both fail into a state that reads as "nothing to
      # report": ALERT_REPO_TOKEN stops filing findings, WATCH_DISPATCH_TOKEN
      # stops the pinger and drops the cadence back to GitHub's own cron. This
      # is the only place either date is checked on the push path.
      - name: Check the hand-kept token expiries
        run: node scripts/checkTokenExpiry.mjs --soon-is-fatal

      # The PoG attestation digest is built three times — Solidity verifies it,
      # viem signs it in production, ethers signs it for operators — with
      # nothing connecting them. Reorder two fields and both signers keep
      # producing well-formed signatures that recover to the wrong address, so
      # every registerPoG reverts for every user at once while all three sides
      # compile and every Solidity test passes (the tests sign with Solidity).
      #
      # The ordering invites the mistake: registerPoG's parameters are
      # (maxAlloc, deadline, nonce, …) but the digest is (…, nonce, deadline, …).
      # Swapping them is type-invisible — verified: `tsc` exits 0 on that exact
      # mutant while this guard names both slots.
      - name: Check PoG digest agrees across Solidity, viem and ethers
        run: node scripts/checkPogDigestTuple.mjs

      # The LP panel's PoolKey and mint range are four integers hard-coded in
      # `contracts.ts` with a comment claiming they mirror the hook. Nothing
      # enforced the mirror, and the check that looked like it did —
      # `checkLpActions.ts` — compares them against themselves: it imports the
      # constants from `contracts.ts` and asserts the payload built from those
      # same constants. Slot position is real; the values agreed for any value.
      #
      # Measured before writing this: TICK_SPACING 200→60, POOL_FEE 3000→500
      # and TICK_LOWER −887200→−887220 applied together left `forge test
      # --isolate`, both TS guards, `checkLpActionsAbi.mjs`, `tsc` and
      # `next build` ALL GREEN — on a PoolKey that hashes to a pool id which
      # was never initialised, so every deposit from the UI would revert.
      - name: Check frontend pool geometry mirrors the hook
        run: node scripts/checkPoolGeometry.mjs

      # Both of these existed and were run only by scripts/precheck.ps1 — a
      # local, Windows-only, opt-in script. That is the same shape as the salt
      # miner guard above, which was RED for as long as nothing ran it.
      #
      # Encoding is not cosmetic here. Editing these files with PowerShell's
      # default ANSI code page silently rewrites em dashes, arrows and
      # box-drawing characters as replacement bytes, and it has happened in
      # this repository. The damage is invisible in a diff viewer that renders
      # both sides the same way, so it needs a byte-level check.
      #
      # The same script now also rejects CRLF, which is the same accident with a
      # worse ending: .gitattributes explains that solc hashes source bytes into
      # the contract metadata and thence into the CREATE2 address, so a .sol
      # saved CRLF puts the hook somewhere nobody mined for. This step passes
      # here by construction — a fresh checkout gets LF from .gitattributes —
      # and the check is aimed at the working tree it cannot see.
      #
      # It also rejects NUL bytes, which are valid UTF-8 and make git treat the
      # file as binary: no diff, no blame, no merge, and a review that sees
      # "Bin 17577 -> 17820 bytes" instead of the changed lines. That is the
      # one failure in this family that CI genuinely adds something to, since
      # a NUL survives checkout intact where a line ending does not.
      #
      # ⚠ SCOPE IS NOW `git ls-files`, NOT A LIST OF DIRECTORIES. The previous
      #   hardcoded list reached 219 of 327 tracked source files and silently
      #   skipped `scripts/`, `monitoring/`, `README.md` and `SECURITY.md`.
      #   Widening it immediately found real CRLF damage in `scripts/`, so the
      #   gap was not theoretical. Nothing needs adding here when a directory
      #   is created.
      - name: Check every tracked source file is valid UTF-8, NUL-free and LF-only
        run: node scripts/checkEncoding.mjs

      # The status page lives in another repository so that it stays up when
      # this one's deploys do not. That separation means nothing here can see
      # it change. Step 4 and the page both instruct their editor to keep the
      # paused wording identical, and instructions in prose are exactly what
      # drifted when `docs/` claimed 25 alerts against a config holding 24.
      #
      # Exit 1 is drift. Exit 2 means the check could not run — transient
      # failures are already retried three times inside the script, so a 2
      # here is a real outage or a page that no longer exists, and both are
      # worth a red build on a page the P0 playbook depends on.
      - name: Check the status page still agrees with the playbook
        run: node scripts/checkStatusPage.mjs

      # The site's footer pointed "GitHub" at `github.com/tosh-protocol` for as
      # long as nobody clicked it — a plausible name for an organisation that
      # has never existed. The one link inviting a reader to stop trusting the
      # copy and read the source answered 404, and every check here was green
      # while it did, because nothing had ever looked outward from the frontend.
      #
      # It also checks the link is *this* repository, resolved from `git remote`
      # rather than from a constant in the script. Reachability alone would have
      # started passing the day somebody registered `tosh-protocol`, which is
      # the same failure the status page had the same day: a reference that is
      # real and still not the right one.
      #
      # Exit 2 is a blocked runner rather than a broken site, on the same
      # reasoning as the step above.
      - name: Check the site's external links resolve and name this repo
        run: node scripts/checkFooterLinks.mjs

      # A 2026-09 sweep found a scope paragraph naming a function called
      # `_verifyPoGSignature` that has never existed — the PoG signature check
      # is inline in `registerPoG`. A stale name in a scope paragraph is a
      # nuisance; the same name as the red-team
      # drill's PASS CRITERION is a control nobody could check, because you
      # cannot watch calls fail at a function that does not exist. The same
      # probe found `mintFromShelf` for `mintBondingCurve` in the invariant
      # notes. Two in one pass, in prose no compiler reads, is a class of drift.
      #
      # Gated on the three docs where a dangling name has a security
      # consequence. The guard's header records why the PRD is excluded and
      # which three symbols in it are known stale.
      - name: Check the docs name only symbols that exist
        run: node scripts/checkDocSymbols.mjs

      # The lint baseline is the map of every narrowing cast in
      # `src/` and the bound each one rests on. It was hand-maintained, and by
      # 2026-09-04 it had rotted in the way that is hardest to notice: it
      # carried a `uint48` row `forge lint` no longer reports AND was missing a
      # third BalanceDelta site, so it described four delta casts where the
      # code has six. The two errors cancelled — the total still read 19, so
      # the arithmetic still reconciled and nobody opened the table.
      #
      # A count would not have caught that. This pins the SET, keyed by source
      # text rather than by line number, so inserting a comment above a cast is
      # invisible to it and a cast appearing or vanishing is not. It also fails
      # if the baseline contradicts the tool, which is the half that rotted.
      #
      # Needs Foundry, not npm — it shells out to `forge lint src --json` and
      # imports nothing. That is why it sits above the npm install rather than
      # with the other node guards below it.
      - name: Check the narrowing-cast triage matches forge lint
        run: node scripts/checkLintFindings.mjs

      # The Slither baseline is the same artefact as the lint one, three times the size:
      # 71 Slither findings, each with a written disposition, all maintained by
      # hand. Running the tool on 2026-09-04 found both failure modes at once.
      #
      # The table had never summed to its own stated total — its rows came to
      # 68 against a prose figure of 70, because `low-level-calls` had no row
      # at all while the impact split counted it. And the run had moved: the
      # dark tax added `_skimInputTax`, which Slither reads as three more
      # `reentrancy-events`, so a new function on the money path went into the
      # audit package with nothing said about it.
      #
      # The second is the one worth a CI minute. "Every finding has been looked
      # at" is the only claim that section makes, and it expires on the next
      # commit unless something re-checks it.
      #
      # Keyed by (detector, file, enclosing scope), so code motion is invisible
      # and a finding appearing or vanishing is not. It also fails when a
      # detector fires with NO row naming it, which is the check that would
      # have caught low-level-calls — a table can be internally consistent and
      # still omit a whole detector.
      #
      # Slither must be pinned: detector counts move between releases, so a
      # baseline against an unstated version means nothing. The version here
      # and the constant in the script have to change together. ~15 s to run
      # against this tree; the pip install dominates.
      - name: Install Slither
        run: pip install slither-analyzer==0.11.6

      - name: Check the Slither triage matches a real run
        run: node scripts/checkSlitherFindings.mjs

      # Aderyn is the second analyser, and it earns its minute by disagreeing
      # with the first rather than by confirming it. Slither reasons over a
      # CFG; Aderyn walks the AST. On the first run against this tree the two
      # genuine findings it produced — a dead `error` declaration and three
      # unreferenced imports — were in a category Slither reports nothing in,
      # and its 19 detectors overlapped Slither's on almost none of the rest.
      #
      # It is also the cheaper of the two by a wide margin: ~6 s against this
      # tree with no compile of its own, where Slither's pip install alone
      # costs more than the whole Aderyn step.
      #
      # Same shape as the gate above — baseline keyed by (detector, file,
      # scope) and counted, version pinned — with one difference that matters
      # when editing it: Aderyn's JSON gives a line number and no enclosing
      # function, so the script RECOVERS the scope by parsing back from the
      # reported line. See its header for what that costs.
      #
      # No install step. Aderyn publishes a single static binary and the
      # action below fetches the pinned one; `pip install` has no equivalent
      # here. The version in the `with:` block and the constant in the script
      # have to change together, same as Slither's.
      - name: Install Aderyn
        run: |
          set -euo pipefail
          VERSION=0.6.8
          URL="https://github.com/Cyfrin/aderyn/releases/download/aderyn-v${VERSION}/aderyn-x86_64-unknown-linux-gnu.tar.xz"
          curl -sSfL "$URL" -o /tmp/aderyn.tar.xz
          curl -sSfL "${URL}.sha256" -o /tmp/aderyn.sha256
          # Compare the digest rather than running `sha256sum -c`: the
          # published file names the artefact with the build host's path
          # prefix, so `-c` fails to resolve it and reports "no file was
          # verified" — which exits 1 and looks like a mismatch.
          PUBLISHED=$(awk '{print $1}' /tmp/aderyn.sha256)
          ACTUAL=$(sha256sum /tmp/aderyn.tar.xz | awk '{print $1}')
          [ "$PUBLISHED" = "$ACTUAL" ] || { echo "aderyn checksum mismatch"; exit 1; }
          # Extract into a dedicated directory and address the binary by its
          # known path. Searching /tmp for it walks the runner's whole temp
          # tree, which both floods the log with "Permission denied" on
          # systemd's private directories and would happily install any other
          # file that happened to be called aderyn.
          mkdir -p /tmp/aderyn-dist
          tar -xJf /tmp/aderyn.tar.xz -C /tmp/aderyn-dist --strip-components=1
          install -m 0755 /tmp/aderyn-dist/aderyn /usr/local/bin/aderyn
          aderyn --version

      - name: Check the Aderyn triage matches a real run
        run: node scripts/checkAderynFindings.mjs

      # The two gates above compare a baseline against a fresh run. Neither of
      # them reads `docs/AUDIT.md`, and until this step nothing did — so the
      # document that summarises them could drift from both indefinitely with
      # CI staying green, which is exactly what happened: it described 74 and
      # 97 findings against baselines holding 76 and 98. Cheap to run and needs
      # neither analyser installed, since it only compares the prose to the
      # baseline files. Placed after them so a genuine re-triage fails on the
      # finding rather than on the paragraph that has not caught up yet.
      - name: Check the audit document matches the baselines
        run: node scripts/checkAuditDoc.mjs

      # `scripts/` carries its own package.json. Two steps below need what it
      # installs — the typecheck, and the drill-page guard, which talks to
      # 46630 through ethers. Hoisted into its own step so that dependency is
      # stated rather than inherited from whichever step happens to run first.
      - name: Install script dependencies
        working-directory: scripts
        run: npm ci

      # The Q1 drill co-signing page asks three non-engineers to approve four
      # EIP-712 Safe payloads. Everything that makes those payloads safe is a
      # literal hand-typed into the status-page repository — a Safe address, a
      # chain id, four selectors, four 66-character hashes — and any one of them
      # wrong yields the same symptom: a signature that recovers to the right
      # person and is rejected as GS026, found only after the human has already
      # been interrupted, and looking exactly like their mistake.
      #
      # So the hashes are recomputed and held against the Safe's own
      # getTransactionHash() on 46630. The guard is self-retiring: between
      # drills the page 404s and it exits 0, so taking the page down does not
      # hold CI red, and putting one back up next quarter re-arms it without
      # anyone having to remember this step exists.
      - name: Check the Q1 drill page agrees with the chain it signs for
        run: node scripts/checkDrillPage.mjs

      # `scripts/` was checked by nothing. frontend.yml runs `tsc --noEmit`
      # inside soat-frontend/ only, so `pogSigner.ts` — which produces the
      # signatures the factory's `registerPoG` recovers against, i.e. the
      # oracle the whole allocation gate rests on — was never compiled by CI.
      # A type error there is not caught until someone runs it by hand.
      - name: Typecheck scripts (pogSigner and friends)
        working-directory: scripts
        run: npx tsc --noEmit -p tsconfig.json
