# The deep search that `foundry.toml` deliberately does not carry.
#
# The invariant depth knee is 250, and raising `foundry.toml` to 250 took
# `test.yml` from 7m27s to 13m12s because it runs the suite twice. So `test.yml`
# keeps depth 100 for the fast signal on every push, and the deeper search runs
# here on its own clock.
#
# What this is NOT: a replacement for `test.yml`. It runs the same predicates,
# harder. Two orders of magnitude more search cannot find a property nobody
# wrote.

name: Soak

permissions: {}

on:
  # Daily, and offset from both the hour and the busy top-of-hour slot:
  # scheduled workflows queue on a shared pool and
  # `0 * * * *` is its worst minute. 05:23 UTC is off-peak for this pool and
  # nobody is waiting on the result, which is the whole point of running it here
  # rather than on the push path.
  #
  # Daily until 2026-09-11, weekly until 2026-09-13, daily again now. The middle
  # period had one cause and it has gone away. The account's 2,000 included
  # minutes were exhausted by day 11 of the cycle and every job stopped starting:
  # a PRIVATE repository whose Actions budget is $0 with "stop usage" set refuses
  # to run rather than bill, and the resulting annotation names a failed payment
  # first, which is not what had happened. Daily was ~1,420 of those minutes at
  # the measured 47m14s per run, with the rest on push-triggered CI.
  #
  # This repository is public, and GitHub does not bill standard-runner minutes
  # for public repositories at all, so the ceiling that forced weekly no longer
  # exists. Restoring daily buys seven times the search for nothing. The trade
  # reverses the moment the repository goes private — that decision has to come
  # back here, because the same 1,420 min/month lands on a 2,000-minute
  # allowance.
  #
  # The depths below are untouched, as they were through both changes. Only how
  # often they run has ever moved, because nobody is waiting on a soak.
  schedule:
    - cron: '23 5 * * *'

  # One one-off search at 512 x 2500 took 46 min locally. Do not put that on the
  # cron. Measured, not extrapolated: the defaults below cost 47m14s per run
  # (build 171s, invariants 1787s, fuzz 819s), and that one-off is 5x their
  # invariant work. It is reachable here on demand instead, which is what these
  # inputs are for.
  #
  # That 47 min was itself estimated at ~21 min beforehand, from a local-to-CI
  # factor of 5.4x measured on a different configuration. The real factor for the
  # invariant step is ~11.5x, because this runner has a couple of cores where a
  # workstation parallelises nine invariant tests properly. Sizing anything here
  # from a local timing will under-count by about half. That was the sixth time
  # the same mistake was made in a single exercise, which is why it is written
  # down here rather than remembered.
  workflow_dispatch:
    inputs:
      invariant_runs:
        description: 'FOUNDRY_INVARIANT_RUNS (nightly default 256)'
        type: string
      invariant_depth:
        description: 'FOUNDRY_INVARIANT_DEPTH (nightly default 1000)'
        type: string
      fuzz_runs:
        description: 'FOUNDRY_FUZZ_RUNS (nightly default 100000)'
        type: string

# A soak has no state and nothing downstream, so a second one starting is only
# ever waste. Cancelled rather than queued, because there is no checkpoint here
# for a cancelled run to leave unscanned.
concurrency:
  group: soak
  cancel-in-progress: true

jobs:
  soak:
    name: Deep invariant and fuzz search
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Required, and its absence is not a quiet failure mode. `permissions: {}` at
    # the top of this file grants NOTHING, so a job without this block cannot even
    # read the repository — and `actions/checkout` reports that 403 as
    # "repository 'https://github.com/<owner>/<repo>/' not found", which reads
    # like a typo in the URL rather than a missing scope. The first dispatch of
    # this workflow failed exactly that way. Read-only on purpose: there is
    # nothing to push.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      # Pinned to match test.yml. A soak that runs a different toolchain than
      # the gate it supplements is comparing two things at once.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Build
        run: forge build

      # Invariants and fuzz are split into two steps on purpose: they fail for
      # different reasons and cost very differently, and a single combined step
      # hides which one blew the timeout.
      #
      # `runs` is raised as well as `depth`. Depth decides how far into the state
      # machine one sequence gets; runs decides how many sequences are tried.
      # The coverage correction behind these settings came from reading one run's
      # counters as if they described the whole suite, and more runs is the only
      # thing that makes the sampled counters below worth anything at all.
      - name: Invariants (deep)
        env:
          FOUNDRY_INVARIANT_RUNS: ${{ inputs.invariant_runs || '256' }}
          FOUNDRY_INVARIANT_DEPTH: ${{ inputs.invariant_depth || '1000' }}
          # Shrinking a real counterexample is worth paying for here in a way it
          # is not on the push path: this run is the only place a deep sequence
          # is found, and an unshrunk 1000-call sequence is not a bug report.
          FOUNDRY_INVARIANT_SHRINK_RUN_LIMIT: '5000'
        run: |
          set -euo pipefail
          echo "runs=$FOUNDRY_INVARIANT_RUNS depth=$FOUNDRY_INVARIANT_DEPTH"
          echo "(test.yml runs the same suite at 128 x 100)"
          forge test --match-contract 'LifecycleInvariantTest|BidBookInvariantTest' -vv \
            | tee "$RUNNER_TEMP/invariants.log"
          if grep -q 'No tests found' "$RUNNER_TEMP/invariants.log"; then
            echo "::error::--match-contract matched no invariant suite, and forge exits 0 on that."
            exit 1
          fi

      - name: Fuzz properties (deep)
        env:
          FOUNDRY_FUZZ_RUNS: ${{ inputs.fuzz_runs || '100000' }}
        run: |
          set -euo pipefail
          echo "runs=$FOUNDRY_FUZZ_RUNS per property (test.yml runs 256)"
          forge test --match-test testFuzz_ \
            | tee "$RUNNER_TEMP/fuzz.log"

      # The counters are the only evidence for whether a run was vacuous, and
      # this is a record of how badly they can be misread: `afterInvariant()`
      # logs the LAST run only, one sample out of `runs`. They are surfaced here
      # because a green soak whose handler reverted into every `catch` block is
      # indistinguishable from a green soak that worked — but they are labelled,
      # so nobody repeats the three conclusions that had to be retracted after
      # being drawn from exactly this output.
      - name: Summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo '### Soak'
            echo
            echo "Invariants: runs=${{ inputs.invariant_runs || '256' }} depth=${{ inputs.invariant_depth || '1000' }} · fuzz: ${{ inputs.fuzz_runs || '100000' }}/property"
            echo
            echo '```'
            grep -E '^\[(PASS|FAIL)|tests? passed|Suite result' "$RUNNER_TEMP/invariants.log" "$RUNNER_TEMP/fuzz.log" 2>/dev/null || echo 'no result lines captured'
            echo '```'
            echo
            echo '#### afterInvariant() counters — ONE sample each, not suite coverage'
            echo
            echo 'These log the last run only. Do not read a zero as "never reached":'
            echo 'a counter that never incremented and a counter whose run never'
            echo 'reached it look identical here.'
            echo
            echo '```'
            grep -E '^  (hooks|ok |ladder )' "$RUNNER_TEMP/invariants.log" 2>/dev/null | head -40 || echo 'no counters captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
