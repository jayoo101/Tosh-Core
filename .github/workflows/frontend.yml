name: Frontend

permissions: {}

on:
  push:
    # See test.yml: `watcher-state` is the watcher's checkpoint branch and holds
    # no frontend source. Building it twice an hour is pure cost.
    branches-ignore: [watcher-state]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: soat-frontend

jobs:
  verify:
    name: Next.js app
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # `src/lib/contracts.ts` throws at import time without this, which would
      # fail the build during prerender. CI never talks to a chain, so any
      # syntactically valid non-precompile address works; it is deliberately
      # NOT a real deployment so a leaked CI log cannot be mistaken for one.
      NEXT_PUBLIC_FACTORY_ADDRESS: "0x1111111111111111111111111111111111111111"
      # Must be a chain `src/lib/chain.ts` registers. It no longer falls back to
      # a default for an id it does not know — it throws — so a stale value here
      # fails the build rather than quietly building against the wrong network.
      #
      # This said 46630 until 2026-09-18, and by then `CHAINS_BY_ID` held only
      # 56, 97 and 31337: the value named a chain the build would have refused to
      # start on. It survived because the job died earlier, at checkPublicEnv, on
      # a separate leftover — so the throw that was supposed to be loud was
      # sitting behind a louder one.
      NEXT_PUBLIC_CHAIN_ID: "97"
      # Same throw-at-import contract as the factory address above, and the
      # reason this job was red for 18 consecutive runs: the BEM move made
      # `NEXT_PUBLIC_QUOTE_ASSET` required with no per-chain default — correctly,
      # since the app must not approve one token while the factory pulls another
      # — and nothing added it here. Every local check stayed green because every
      # developer has it in .env.local, so the first thing that noticed was
      # `next build` collecting page data for /_not-found.
      #
      # A distinct placeholder from the factory's, rather than the same
      # `0x1111…`: two addresses that differ make a CI log say which variable a
      # call was aimed at, and the quote asset being the factory is not a shape
      # worth teaching the build to accept.
      NEXT_PUBLIC_QUOTE_ASSET: "0x2222222222222222222222222222222222222222"
      # `mBEM`, not `BEM`, and not left to the `?? 'BEM'` fallback. The chain id
      # above is 97, where the quote asset is an unrestricted-mint 8-decimal mock
      # with no market — `contracts.ts` says as much where `QUOTE_POSITIONING` is
      # defined, and that string is what link previews render. Taking the
      # fallback would have this job build copy claiming the real asset on a
      # testnet id, which is the exact class of quiet lie checkChainCopy exists
      # to fail on.
      NEXT_PUBLIC_QUOTE_SYMBOL: "mBEM"
      # Monitoring stays off in CI: no DSN means the Sentry SDK initialises
      # nothing, and no build ever ships a source map to a real project.
      NEXT_PUBLIC_SENTRY_DSN: ""
      # `app/lib/supabase.ts` builds its client at module scope and throws when
      # these are missing, so `next build` cannot collect route config for
      # /api/projects/lookup without them — a build that only ever succeeded
      # because every developer has a populated .env.local.
      #
      # Same reasoning as the factory address above: createClient() needs a
      # syntactically valid URL and nothing more, CI never opens the socket,
      # and the host is deliberately one that does not resolve so no run can
      # touch a real registry.
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: soat-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Split out of `npm run verify` so a red check names the failing stage in
      # the job list instead of making someone open the log to find out.
      - name: Design tokens
        run: npm run tokens:strict

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint

      # Runs on every chain the UI supports, not just the one CI is configured
      # for. The strings that break on the mainnet cutover are precisely the
      # ones no CI run would otherwise evaluate. See PM-F6.
      - name: Chain copy reads correctly on every chain
        run: node scripts/checkChainCopy.mjs

      # Next.js inlines `NEXT_PUBLIC_*` by substituting the literal source text
      # `process.env.NEXT_PUBLIC_FOO`, so a computed `process.env[name]` is
      # never substituted and silently resolves to undefined in the browser.
      # Types, lint and `next build` all pass; `next dev` and every route
      # handler work, because those run in Node. The failure surfaces only on a
      # chain cutover, as a build that ignores every address the operator set.
      # Also checks the inverse: an env var documented in the production
      # template that no source file statically reads.
      - name: Public env vars are actually inlined
        run: node scripts/checkPublicEnv.mjs

      # The step above proves each variable is READ. It has no opinion on the
      # values, and PM-C7 shipped a production build with every check green:
      # the factory and treasury were set to the canonical 4663 contracts while
      # NEXT_PUBLIC_CHAIN_ID stayed 46630, so the site connected wallets to
      # testnet and read addresses that have no code there. The factory address
      # is not keyed by the chain id — it is read straight from the environment
      # — so nothing cross-checked the two.
      #
      # Reads the ambient environment, which is how this job and Vercel both
      # supply these; a dotenv-only check is blind to both. CI's placeholder
      # factory is deliberately not a real deployment, so it is unrecognised
      # and not asserted — what fails here is a real address under the wrong id,
      # including the id being unset, since chain.ts then defaults to 97.
      - name: Chain id and contract addresses are the same chain
        run: npm run guard:chainaddr

      # Endpoint selection used to be copy-pasted into four modules, each
      # falling back to a hardcoded `https://sepolia.base.org` and each pairing
      # it with `chain: targetChain` — so the chain a client was bound to and
      # the chain its transport talked to were chosen by different expressions.
      # A mainnet build that set no RPC read Sepolia. `POST /api/projects`
      # authenticates a listing from the creator in a launch receipt, so
      # reading that receipt on the wrong chain lets a free testnet launch
      # authenticate a row in the mainnet directory. Env is read at module
      # load, so only a source check can see this.
      - name: RPC endpoints are chosen against an explicit chain id
        run: npm run guard:rpc

      # supabase-js has no default timeout and retries four times with backoff,
      # so an unreachable registry does not fail — it grinds for ~14 s. Two of
      # the three call sites had never considered it: the directory list
      # answered 500 after fourteen seconds, and the publish write could hang
      # for the same span with the user's launch already mined. The failure was
      # a question a call site did not ask, so it is the next one added that
      # this catches.
      - name: Supabase queries carry a deadline
        run: npm run guard:supabase

      # The LP panel quotes deposits from fixed-point maths hand-ported out of
      # infinity-core's SqrtPriceMath and infinity-periphery's LiquidityAmounts.
      # The arithmetic is bit-identical to the Uniswap V4 port it replaced
      # (measured, not assumed); a drift here does not throw: the panel just
      # quotes an amount the pool will refuse, so the mint reverts on
      # `amount1Max` after the user has already signed two Permit2 approvals.
      - name: Infinity CL fixed-point maths matches Solidity vectors
        run: npm run guard:clmath

      # posm decodes `modifyLiquidities` payloads with hard-coded calldata
      # offsets and a decoder that reverts on any non-canonical abi offset, so a
      # reordered or rewidened param produces `SliceOutOfBounds` — an opaque
      # revert from a wallet popup with nothing failing at compile time.
      #
      # This half runs the real viem encoder and checks the bytes it emits. The
      # offsets it expects are pinned to the vendored periphery Solidity by
      # scripts/checkLpActionsAbi.mjs over in test.yml, which is the job that
      # has `lib/`. Neither half is sufficient alone.
      - name: posm action payloads have the layout the decoder reads
        run: npm run guard:lpactions

      # `contracts.ts` restates ~18 numbers the contracts define — the genesis
      # supply split, the tier ladder, the price ceiling, the TWAP and launch
      # windows, the genesis durations — plus the factory's MIN_SOFT_CAP_PROD and
      # MAX_COOLDOWN, and pogQuota.ts mirrors MAX_SIG_VALIDITY. Only the four
      # pool-geometry values were checked against Solidity (checkPoolGeometry.mjs,
      # over in test.yml); the rest were two independent declarations of one
      # number. Nothing here throws on drift — the UI just quotes a supply that
      # is not minted, or mines a salt `createLaunch` rejects as InvalidHookSalt.
      # Added after the PoG attestation TTL drifted this exact way and only an
      # eth_call against a live factory caught it.
      - name: Frontend constants mirror the contracts
        run: npm run guard:constants

      # The launch page pre-flights `createLaunch` with `simulateContract` and
      # then sends the real one from `useTosh`. When the launch fee stopped
      # being a BEM `transferFrom` and became native BNB, the write grew a
      # `value` and the pre-flight did not — so the simulation checked a
      # transaction nobody would send, the factory saw `msg.value == 0`, and
      # every launch died on `InsufficientLaunchFee` before the wallet opened.
      # tsc allows it (viem's `value` is optional), eslint has no opinion, and
      # the e2e script drives the contract directly so it never touches the
      # page. Payability is read from the shipped ABIs, so a new payable
      # function is covered the day it lands.
      - name: Calls to payable functions send a value
        run: npm run guard:payable

      # `useChainId()` answers with the CONFIG's chain and wagmi refuses to move
      # that value onto a chain the config does not list, so every
      # `chainId !== TARGET_CHAIN_ID` built on it read 97 !== 97 and passed. A
      # wallet parked on 4663 — this build's previous target — got no
      # wrong-network strip, a live Deploy button, and `ChainMismatchError`
      # thrown by viem after the click. The gate meant to catch it was comparing
      # the config against itself.
      - name: Wrong-network checks read the wallet, not the config
        run: npm run guard:walletchain

      # `fmt` / `fmtFull` default to 18 decimals. After the quote asset moved
      # to 8-decimal BEM, headline prices and commission hints kept calling
      # the default, so every figure was understated by 10^10 and still
      # looked like a price. `fmtQuote` exists for this; this guard fails
      # any call site that goes back to the default on a quote-priced name.
      - name: Quote amounts use the quote scale
        run: npm run guard:quoteformat

      # `PartialDictionary` already stops a locale inventing or misspelling a
      # key, so this is here for the failures a type cannot express: a translator
      # deleting the `{action}` out of a template, which still typechecks and
      # still renders while losing the one part of the line that says which
      # transaction confirmed; a blank value, which `mergeDictionary` treats as
      # untranslated and papers over with English forever; and a Tier-0 surface
      # left half-finished in a locale that has been promised complete. The types
      # allow an incomplete locale on purpose — six languages of money copy
      # cannot land in one commit — so which ones are DONE is a promise, and a
      # promise belongs in a guard rather than in a comment.
      - name: Locale dictionaries agree with English
        run: npm run guard:i18n

      # Last of the guards, and the one that is about the list above rather than
      # about the source. `npm run guards` and the steps in this file are two
      # hand-maintained copies of the same list, and until now nothing compared
      # them — so a guard added to the aggregate and forgotten here would run on
      # its author's machine, pass, and never block a merge again. The aggregate
      # made it look covered, which is why an absent guard is worse than a broken
      # one.
      #
      # Same failure as the two test floors further down, which sat 58 and 32
      # tests adrift for the same reason: a hand-maintained number nobody checked.
      # Both were found by reading, not by CI. This is the check that would have
      # found them.
      #
      # It resolves each entry through package.json to the script it really runs,
      # because this file invokes some by npm alias and others by path — a plain
      # string diff calls `guard:env` missing when its script runs on every push.
      - name: Every guard in the aggregate is wired into this workflow
        run: npm run guard:guardcoverage

      # The guards above are static checks on source text; these exercise the
      # code. Both are needed: a guard cannot tell whether a rate-limit bucket
      # is actually keyed on the entry it reads, and a test cannot see a
      # hardcoded endpoint that only the mainnet build would reach.
      #
      # Every suite here is mutation-tested — the original defect was
      # reintroduced and the tests were confirmed to fail — so they pin
      # behaviour rather than merely covering lines.
      #
      # `scripts/` carries its own package.json, and one of the suites below
      # spawns `rotateGasRate.mjs template` to prove the CLI parses the signed
      # message out of this tree rather than keeping its own copy. Without this
      # step that test failed on a missing `ethers` — a red check that named the
      # dependency instead of the drift it exists to catch, which is the same as
      # not having the check.
      - name: Install script dependencies
        working-directory: scripts
        run: npm ci

      - name: Server behaviour tests
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/vitest.log

      # The Foundry job has had a floor guard since it was written; this side
      # never did, and two separate reviews recorded the asymmetry rather than
      # closing it.
      #
      # It is not redundant with the tests passing. A suite that stops being
      # collected — a renamed file that no longer matches the include glob, a
      # `describe` that throws at import, a `vi.mock` that swallows the module
      # under test — reports success, because "every test that ran, passed" and
      # "the tests ran" are the same exit code. That is precisely how the PoG
      # deadline went untested: `computeDeadline()` had no test file at all, and
      # nothing anywhere said so.
      #
      # 169 on 2026-09-05: 162 after the §5.14 deadline sweep added
      # `pogQuota.test.ts` (10), plus 7 in `chain.test.ts` for the PoG chain
      # allowlist. Lower this in the same commit as any deliberate removal, and
      # say why.
      #
      # 169 -> 179 the same day: `FactoryDials.test.tsx`, the first component
      # tests in this suite. The three bounded admin dials refuse a value the
      # factory reverts on, and §5.14 had recorded all three as untested because
      # nothing here could render a component at all.
      #
      # 179 -> 188: §5.15 gave `setDefaultSoftCap` and `setMaxPogAllocationLimit`
      # the ceilings §5.10 had declined to add, so both dials gained boundary and
      # wei/ether-slip tests, plus one pinning that the new upper blocker did not
      # shadow the zero blocker that keeps `createLaunch` alive.
      #
      # 188 -> 290 on 2026-09-14, and the size of that jump is the finding. The
      # floor was never raised as the suite grew, so it had stopped being a
      # guard: 102 tests — every API route suite among them — could have stopped
      # being collected with this step still green, which is the exact failure it
      # was written to catch. Raise it in the same commit as any addition.
      #
      # 290 -> 293: `/api/watch-ping` now answers a missing credential and a
      # wrong one differently, and the three added tests pin the distinction.
      # It cannot be checked from outside without them — the whole point is
      # that the status code is the only signal a third-party pinger shows.
      #
      # 293 -> 297: the 502 branch now names which of two opposite repairs the
      # operator needs, and four tests pin it. That branch fired in production
      # on 2026-09-14 carrying nothing but a status code, which is how a token
      # holding the wrong permission and a workflow missing its trigger reached
      # the pinger as the same event.
      #
      # 297 is the COLLECTED total, which is what the parser below reads: 293
      # that run plus the 4 in `gasHistory.live.test.ts`. Those 4 are collected
      # and reported skipped, because `describe.runIf(POG_LIVE_SCAN === '1')`
      # gates them and CI does not set it — so the number does not move when
      # somebody runs the live scan by hand.
      #
      # 297 -> 355 on 2026-09-21, found by the pre-mainnet sweep rather than by
      # this step, which is the whole problem with it. The floor had trailed the
      # suite by 58 across the countdown, referral-desk and quote-scale work, so
      # every test added since 09-14 — `ReferralPanel.test.tsx`, the
      # `genesisWindow` direction tests, the `HeroStats` quote-scale test — sat
      # below it and could have stopped being collected with this step green.
      #
      # That is the SECOND time this floor has been found 58-or-100 adrift (see
      # the 188 -> 290 entry, which says "raise it in the same commit as any
      # addition" and was then not followed). Two occurrences of the same drift
      # is a sign the instruction in prose is not enough; the durable repair is
      # a step that reads the floor off the run and fails when it is more than a
      # few below, so that growing the suite without raising the floor is itself
      # the red check.
      #
      # ✓ THAT REPAIR IS NOW IMPLEMENTED — see the `slack`/`ceiling` check in the
      #   step below. The paragraph above ended "worth doing next time this file
      #   is opened", which is the same kind of instruction-in-prose that had just
      #   failed twice, and it survived several more openings. A floor only ever
      #   caught the suite SHRINKING; nothing caught it growing, so every addition
      #   widened the gap in silence. Both directions are checked now, and the
      #   numbers below are maintained because CI makes them be.
      #
      # 355 -> 357 the same day: two cases in `ReferralPanel.test.tsx` covering
      # the other two reads that collapsed a pending result into a pessimistic
      # answer. `quotaKnown` had fixed one of three. The sharper of the two is
      # `claimableReferral`, where a `?? 0n` unmounted the entire card on a
      # launched project that owed the wallet commission — verified by inverting
      # both guards, which turns exactly these two red and nothing else.
      #
      # 357 -> 361: `refundReads.test.tsx`, four cases on the last two panels that
      # received `nativeDeposited` through a `?? 0n`. `RefundPanel` gates its
      # button on `=== 0n`, so a depositor arriving to collect a FAILED round was
      # told the wallet had nothing deposited while the figure was still in
      # flight; `GenesisClaimPanel` returns `null` on the same comparison, so the
      # card for a real allocation was absent rather than blank.
      #
      # Two of the four are controls on a confirmed zero, and they earn their
      # place: the first draft asserted on the blocker text, which is not rendered
      # while the connect gate outranks it, so the test passed no matter what the
      # panel did. They assert on the readout instead — `…` against a stated `0` —
      # and inverting both fixes turns exactly the two pending cases red.
      #
      # 361 -> 372, two pieces of work, and the slack band is what held the
      # reminder until one of them tipped it over:
      #
      #   • +6 in `gasHistory.test.ts` for scanning chain 56 through Etherscan v2
      #     — a second vendor means the URL shape, the key and the error semantics
      #     all fork, and the sharpest of the six covers the fork that has no
      #     analogue at Blockscout: Etherscan answers an invalid key with HTTP 200
      #     and `status: "0"`, which the empty-history reader had every reason to
      #     read as "this wallet has never transacted".
      #
      #   • +5 in `api/pog-scan/route.test.ts` for the per-chain breakdown, which
      #     had no coverage at all — that file was entirely about rate limits, so
      #     `present()` could denominate a row in anything. The headline case sums
      #     the rows and asserts the total, because that is the property the
      #     display has to have and it fails for either mistake, sending the
      #     chain's own coin or converting twice.
      #
      # 372 -> 398, all of it the homepage feature pin, and the two halves cover
      # the two things that were unguarded rather than the code that was added:
      #
      #   • +11 in `teaserOrder.test.ts`. The homepage ordering had no test at
      #     all while it was one `.sort()` inside a component that cannot be
      #     mounted without a factory to read from. It now has a precedence
      #     order in it, so the cases are the boundaries of that: a pin beats a
      #     larger raise, an expired pin does not, a pin cannot drag an
      #     ineligible launch into the block, and an unsynced clock honours the
      #     pin rather than calling every pin expired. The one that would
      #     otherwise rot silently is the tie: early on every raise is 0, so
      #     EVERY comparison takes the tie branch, and returning 0 there is what
      #     preserves newest-first — a tie-break invented later would replace
      #     that ordering with nothing saying so.
      #
      #   • +15 in `api/admin/featured/route.test.ts`, on a route that can
      #     rearrange the front page. Four properties, and the sharpest is the
      #     ORDER of the two writes: the clear has to precede the set, because
      #     failing the other way round leaves two pins and an operator whose
      #     pin did not take cannot see why from the page. Also that the route is
      #     closed with no credential configured, that it refuses a credential
      #     that is not a secret — the guard written after an admin variable was
      #     found set to the owner's public address — and that it will not pin a
      #     launch with no registry row, which would answer 200 and change
      #     nothing. Verified by mutation: dropping the `not(... is null)` filter
      #     and raising the 14-day ceiling turn exactly two of these red.
      #
      # 398 -> 482, the localisation work, which grew the suite across several
      # commits before this step was next run:
      #
      #   • English golden masters for every surface put through the dictionary —
      #     the money-back panels, the deposit success dialog, the wallet pip, and
      #     now the navbar, footer, directory page and both card shapes (+14 in
      #     `directory.golden.test.tsx`). Each pins the rendered English before
      #     the strings move, so a translation layer that changes a word of it
      #     turns red rather than shipping.
      #
      #   • The GENESIS panel's gate ordering and the action gate's readouts,
      #     which the localised verdicts had to keep outranking correctly.
      #
      # 482 -> 508, the same work reaching the project page: +3 for the landing
      # page, +17 in `projectRails.golden.test.tsx` — exhaustive over `Phase`
      # because the header strip and the lifecycle rail are ternaries between
      # near-neighbour strings, and a swap between two arms only shows when both
      # render — and +6 for the identity header above the terminal.
      - name: Assert the frontend suite did not silently shrink
        run: |
          set -euo pipefail
          floor=638

          # vitest's summary reads `Tests  169 passed (169)`, and on a red run
          # `Tests  1 failed | 168 passed (169)`. The parenthesised total is the
          # collected count either way, which is the number this guards.
          #
          # ANSI colour is stripped first and the match is not anchored at the end
          # of the line: vitest colours that summary, so a trailing reset code sits
          # after the closing paren and an anchored pattern silently finds nothing.
          # A guard that cannot parse its input fails closed below, but it fails on
          # every run rather than never — which is the same as not having it.
          total=$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/vitest.log \
                  | grep -oE '^[[:space:]]*Tests[[:space:]].*\([0-9]+\)' \
                  | tail -1 | grep -oE '\([0-9]+\)' | tail -1 | tr -d '()')

          if [ -z "$total" ]; then
            echo "::error::Could not read a test count from vitest's summary line. The output format changed, or the run did not finish."
            exit 1
          fi

          echo "collected=$total floor=$floor"

          if [ "$total" -lt "$floor" ]; then
            echo "::error::$total tests were collected, below the floor of $floor. A suite is missing rather than failing. If tests were deliberately removed, lower the floor in this workflow in the same commit and say why."
            exit 1
          fi

          # ── The other direction, which is what kept letting this floor rot ──
          #
          # A floor only catches a SHRINKING suite. Nothing caught a GROWING one,
          # so every addition widened the gap silently and the floor decayed into
          # decoration — twice at 58 adrift and once at 100, each found by reading
          # rather than by CI. The note above called for exactly this step and then
          # asked the next reader to remember; five hand-bumps later, it is here.
          #
          # `slack` is the number of tests that may be added before the floor must
          # move. Not zero: a PR that adds a test should not fail on a number in a
          # different file, and a small band keeps the reminder attached to the
          # work rather than to every commit. Not large either, or it is the old
          # problem with extra steps.
          slack=8
          ceiling=$(( floor + slack ))
          if [ "$total" -gt "$ceiling" ]; then
            echo "::error::$total tests collected against a floor of $floor (slack $slack). The suite has grown and the floor has not, which is how it previously drifted 58 and 100 tests adrift and stopped guarding anything. Raise floor to $total in this workflow, in this commit, with a line saying what was added."
            exit 1
          fi

      - name: Build
        run: npm run build

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Separate job on purpose. A new advisory published against some transitive
    # build dependency is not a reason to hide whether the app still typechecks
    # and builds, and the reverse is also true.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: soat-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The tree was at zero high/critical advisories when this gate was added,
      # held there by the `overrides` block in package.json. The gate exists so
      # that going back to nine is a red check rather than something someone
      # notices by chance months later.
      #
      # `npm audit` exits non-zero for two unrelated reasons: it found
      # advisories, or it could not reach the registry to look. Only the first
      # is ours. This step went red on 2026-09-04 because npmjs.org answered
      # the audit endpoint with 503, and a gate that fails on somebody else's
      # outage is a gate people learn to re-run without reading -- which is
      # exactly how the nine advisories this exists to catch would slip past.
      #
      # Retried since 2026-09-13, and only on the unreachable branch. Three
      # attempts recover a blip. After that the step fails: a green check and
      # a skipped advisory report used to be the same colour, which is the
      # hole this gate exists to close. A real 503 storm will go red and ask
      # for a re-run; that is louder than a silent skip, and it is the trade.
      #
      # Findings are never retried. They are deterministic against a lockfile, so
      # a second look would cost 20 seconds to reach the same answer, and a gate
      # that retries a real failure is one attempt away from being a flaky gate.
      - name: npm audit (fail on high or critical)
        run: |
          # Actions runs this with `set -e`, so capture the status through an
          # AND-OR list rather than a bare `$?`, which the -e would act on
          # before the next line could read it.
          unreachable='audit endpoint returned an error|Service Unavailable|ENOTFOUND|ETIMEDOUT|ECONNRESET|EAI_AGAIN|socket hang up'
          attempts=3
          attempt=1

          while : ; do
            out=$(npm audit --audit-level=high 2>&1) && code=0 || code=$?

            if [ "$code" -eq 0 ]; then
              printf '%s\n' "$out"
              exit 0
            fi

            if ! printf '%s' "$out" | grep -qE "$unreachable"; then
              # Real advisories. Fatal on the first look, by design.
              printf '%s\n' "$out"
              exit "$code"
            fi

            if [ "$attempt" -ge "$attempts" ]; then
              printf '%s\n' "$out"
              echo "::error::npm's audit endpoint was unreachable on all $attempts attempts, so advisories were NOT checked on this run. A green check here would be the same shape as a clean advisory report."
              exit 1
            fi

            echo "attempt $attempt/$attempts: audit endpoint unreachable, retrying in $(( attempt * 10 ))s"
            sleep "$(( attempt * 10 ))"
            attempt=$(( attempt + 1 ))
          done
