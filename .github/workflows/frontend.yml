name: Frontend

permissions: {}

on:
  push:
    # See test.yml: `watcher-state` is the watcher's checkpoint branch and holds
    # no frontend source. Building it twice an hour is pure cost.
    branches-ignore: [watcher-state]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: soat-frontend

jobs:
  verify:
    name: Next.js app
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # `src/lib/contracts.ts` throws at import time without this, which would
      # fail the build during prerender. CI never talks to a chain, so any
      # syntactically valid non-precompile address works; it is deliberately
      # NOT a real deployment so a leaked CI log cannot be mistaken for one.
      NEXT_PUBLIC_FACTORY_ADDRESS: "0x1111111111111111111111111111111111111111"
      # Must be a chain `src/lib/chain.ts` registers. It no longer falls back to
      # a default for an id it does not know — it throws — so a stale value here
      # fails the build rather than quietly building against the wrong network.
      NEXT_PUBLIC_CHAIN_ID: "46630"
      # Monitoring stays off in CI: no DSN means the Sentry SDK initialises
      # nothing, and no build ever ships a source map to a real project.
      NEXT_PUBLIC_SENTRY_DSN: ""
      # `app/lib/supabase.ts` builds its client at module scope and throws when
      # these are missing, so `next build` cannot collect route config for
      # /api/projects/lookup without them — a build that only ever succeeded
      # because every developer has a populated .env.local.
      #
      # Same reasoning as the factory address above: createClient() needs a
      # syntactically valid URL and nothing more, CI never opens the socket,
      # and the host is deliberately one that does not resolve so no run can
      # touch a real registry.
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: soat-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Split out of `npm run verify` so a red check names the failing stage in
      # the job list instead of making someone open the log to find out.
      - name: Design tokens
        run: npm run tokens:strict

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint

      # Runs on every chain the UI supports, not just the one CI is configured
      # for. The strings that break on the mainnet cutover are precisely the
      # ones no CI run would otherwise evaluate. See PM-F6.
      - name: Chain copy reads correctly on every chain
        run: node scripts/checkChainCopy.mjs

      # Next.js inlines `NEXT_PUBLIC_*` by substituting the literal source text
      # `process.env.NEXT_PUBLIC_FOO`, so a computed `process.env[name]` is
      # never substituted and silently resolves to undefined in the browser.
      # Types, lint and `next build` all pass; `next dev` and every route
      # handler work, because those run in Node. The failure surfaces only on a
      # chain cutover, as a build that ignores every address the operator set.
      # Also checks the inverse: an env var documented in the production
      # template that no source file statically reads.
      - name: Public env vars are actually inlined
        run: node scripts/checkPublicEnv.mjs

      # The step above proves each variable is READ. It has no opinion on the
      # values, and PM-C7 shipped a production build with every check green:
      # the factory and treasury were set to the canonical 4663 contracts while
      # NEXT_PUBLIC_CHAIN_ID stayed 46630, so the site connected wallets to
      # testnet and read addresses that have no code there. The factory address
      # is not keyed by the chain id — it is read straight from the environment
      # — so nothing cross-checked the two.
      #
      # Reads the ambient environment, which is how this job and Vercel both
      # supply these; a dotenv-only check is blind to both. CI's placeholder
      # factory is deliberately not a real deployment, so it is unrecognised
      # and not asserted — what fails here is a real address under the wrong id,
      # including the id being unset, since chain.ts then defaults to 46630.
      - name: Chain id and contract addresses are the same chain
        run: npm run guard:chainaddr

      # Endpoint selection used to be copy-pasted into four modules, each
      # falling back to a hardcoded `https://sepolia.base.org` and each pairing
      # it with `chain: targetChain` — so the chain a client was bound to and
      # the chain its transport talked to were chosen by different expressions.
      # A mainnet build that set no RPC read Sepolia. `POST /api/projects`
      # authenticates a listing from the creator in a launch receipt, so
      # reading that receipt on the wrong chain lets a free testnet launch
      # authenticate a row in the mainnet directory. Env is read at module
      # load, so only a source check can see this.
      - name: RPC endpoints are chosen against an explicit chain id
        run: npm run guard:rpc

      # supabase-js has no default timeout and retries four times with backoff,
      # so an unreachable registry does not fail — it grinds for ~14 s. Two of
      # the three call sites had never considered it: the directory list
      # answered 500 after fourteen seconds, and the publish write could hang
      # for the same span with the user's launch already mined. The failure was
      # a question a call site did not ask, so it is the next one added that
      # this catches.
      - name: Supabase queries carry a deadline
        run: npm run guard:supabase

      # The LP panel quotes deposits from fixed-point maths hand-ported out of
      # v4-core's SqrtPriceMath and v4-periphery's LiquidityAmounts. A drift
      # here does not throw: the panel just quotes an amount the pool will
      # refuse, so the mint reverts on `amount1Max` after the user has already
      # signed two Permit2 approvals. Pins the TS against vectors recorded from
      # Foundry. See scripts/checkV4Math.ts.
      - name: v4 fixed-point maths matches Solidity vectors
        run: npm run guard:v4math

      # posm decodes `modifyLiquidities` payloads with hard-coded calldata
      # offsets and a decoder that reverts on any non-canonical abi offset, so a
      # reordered or rewidened param produces `SliceOutOfBounds` — an opaque
      # revert from a wallet popup with nothing failing at compile time.
      #
      # This half runs the real viem encoder and checks the bytes it emits. The
      # offsets it expects are pinned to the vendored periphery Solidity by
      # scripts/checkLpActionsAbi.mjs over in test.yml, which is the job that
      # has `lib/`. Neither half is sufficient alone.
      - name: posm action payloads have the layout the decoder reads
        run: npm run guard:lpactions

      # `contracts.ts` restates ~18 numbers the contracts define — the genesis
      # supply split, the tier ladder, the price ceiling, the TWAP and launch
      # windows, the genesis durations — plus the factory's MIN_SOFT_CAP_PROD and
      # MAX_COOLDOWN, and pogQuota.ts mirrors MAX_SIG_VALIDITY. Only the four
      # pool-geometry values were checked against Solidity (checkPoolGeometry.mjs,
      # over in test.yml); the rest were two independent declarations of one
      # number. Nothing here throws on drift — the UI just quotes a supply that
      # is not minted, or mines a salt `createLaunch` rejects as InvalidHookSalt.
      # Added after the PoG attestation TTL drifted this exact way and only an
      # eth_call against a live factory caught it.
      - name: Frontend constants mirror the contracts
        run: npm run guard:constants

      # The guards above are static checks on source text; these exercise the
      # code. Both are needed: a guard cannot tell whether a rate-limit bucket
      # is actually keyed on the entry it reads, and a test cannot see a
      # hardcoded endpoint that only the mainnet build would reach.
      #
      # Every suite here is mutation-tested — the original defect was
      # reintroduced and the tests were confirmed to fail — so they pin
      # behaviour rather than merely covering lines.
      #
      # `scripts/` carries its own package.json, and one of the suites below
      # spawns `rotateGasRate.mjs template` to prove the CLI parses the signed
      # message out of this tree rather than keeping its own copy. Without this
      # step that test failed on a missing `ethers` — a red check that named the
      # dependency instead of the drift it exists to catch, which is the same as
      # not having the check.
      - name: Install script dependencies
        working-directory: scripts
        run: npm ci

      - name: Server behaviour tests
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/vitest.log

      # The Foundry job has had a floor guard since it was written; this side
      # never did, and two separate reviews recorded the asymmetry rather than
      # closing it.
      #
      # It is not redundant with the tests passing. A suite that stops being
      # collected — a renamed file that no longer matches the include glob, a
      # `describe` that throws at import, a `vi.mock` that swallows the module
      # under test — reports success, because "every test that ran, passed" and
      # "the tests ran" are the same exit code. That is precisely how the PoG
      # deadline went untested: `computeDeadline()` had no test file at all, and
      # nothing anywhere said so.
      #
      # 169 on 2026-09-05: 162 after the §5.14 deadline sweep added
      # `pogQuota.test.ts` (10), plus 7 in `chain.test.ts` for the PoG chain
      # allowlist. Lower this in the same commit as any deliberate removal, and
      # say why.
      #
      # 169 -> 179 the same day: `FactoryDials.test.tsx`, the first component
      # tests in this suite. The three bounded admin dials refuse a value the
      # factory reverts on, and §5.14 had recorded all three as untested because
      # nothing here could render a component at all.
      #
      # 179 -> 188: §5.15 gave `setDefaultSoftCap` and `setMaxPogAllocationLimit`
      # the ceilings §5.10 had declined to add, so both dials gained boundary and
      # wei/ether-slip tests, plus one pinning that the new upper blocker did not
      # shadow the zero blocker that keeps `createLaunch` alive.
      - name: Assert the frontend suite did not silently shrink
        run: |
          set -euo pipefail
          floor=188

          # vitest's summary reads `Tests  169 passed (169)`, and on a red run
          # `Tests  1 failed | 168 passed (169)`. The parenthesised total is the
          # collected count either way, which is the number this guards.
          #
          # ANSI colour is stripped first and the match is not anchored at the end
          # of the line: vitest colours that summary, so a trailing reset code sits
          # after the closing paren and an anchored pattern silently finds nothing.
          # A guard that cannot parse its input fails closed below, but it fails on
          # every run rather than never — which is the same as not having it.
          total=$(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/vitest.log \
                  | grep -oE '^[[:space:]]*Tests[[:space:]].*\([0-9]+\)' \
                  | tail -1 | grep -oE '\([0-9]+\)' | tail -1 | tr -d '()')

          if [ -z "$total" ]; then
            echo "::error::Could not read a test count from vitest's summary line. The output format changed, or the run did not finish."
            exit 1
          fi

          echo "collected=$total floor=$floor"

          if [ "$total" -lt "$floor" ]; then
            echo "::error::$total tests were collected, below the floor of $floor. A suite is missing rather than failing. If tests were deliberately removed, lower the floor in this workflow in the same commit and say why."
            exit 1
          fi

      - name: Build
        run: npm run build

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Separate job on purpose. A new advisory published against some transitive
    # build dependency is not a reason to hide whether the app still typechecks
    # and builds, and the reverse is also true.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: soat-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The tree was at zero high/critical advisories when this gate was added,
      # held there by the `overrides` block in package.json. The gate exists so
      # that going back to nine is a red check rather than something someone
      # notices by chance months later.
      #
      # `npm audit` exits non-zero for two unrelated reasons: it found
      # advisories, or it could not reach the registry to look. Only the first
      # is ours. This step went red on 2026-09-04 because npmjs.org answered
      # the audit endpoint with 503, and a gate that fails on somebody else's
      # outage is a gate people learn to re-run without reading -- which is
      # exactly how the nine advisories this exists to catch would slip past.
      # Unreachable is a warning; findings stay fatal.
      - name: npm audit (fail on high or critical)
        run: |
          # Actions runs this with `set -e`, so capture the status through an
          # AND-OR list rather than a bare `$?`, which the -e would act on
          # before the next line could read it.
          out=$(npm audit --audit-level=high 2>&1) && code=0 || code=$?
          printf '%s\n' "$out"

          if [ "$code" -eq 0 ]; then
            exit 0
          fi

          if printf '%s' "$out" | grep -qE 'audit endpoint returned an error|Service Unavailable|ENOTFOUND|ETIMEDOUT|ECONNRESET|EAI_AGAIN|socket hang up'; then
            echo "::warning::npm's audit endpoint was unreachable, so advisories were NOT checked on this run."
            exit 0
          fi

          exit "$code"
