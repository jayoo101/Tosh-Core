name: Verify deployment

# ⚠ THE RUN NAME CARRIES THE CHAIN, and that is a safety control rather than a
#   nicety. Both inputs below are `choice` with testnet defaults, so a dispatch
#   that accepts them reads `broadcast/DeployV2.s.sol/97/run-latest.json` once a
#   testnet deploy is committed, verifies testnet, and goes green. An operator who
#   opened this workflow to publish MAINNET source then has a green
#   "Verify deployment" against their name and no reason to look further.
#
#   The inputs are internally coherent in that case, so the guard in the verify
#   step cannot catch it; only the label can. In the Actions list this now reads
#   "Verify DeployV2.s.sol on chain 97", which is unmistakable at a glance and
#   stays in the run history as the record of what was actually published.
run-name: Verify ${{ inputs.script }} on chain ${{ inputs.chain }}

# Manual only. Verification is not idempotent in a useful way -- a second run
# against an already-verified address answers "already verified" and costs a
# call -- and it needs a credential, so it does not belong on push.
#
# WHY THIS RUNS HERE AND NOT ON A LAPTOP
#
# `ETHERSCAN_API_KEY` lives in repository secrets and nowhere else. Running
# `forge verify-contract` locally means first copying that key into a dotenv,
# which is the plaintext-at-rest state `checkSecretStore.mjs` exists to
# report. A workflow reads the secret into a process and never writes it down.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE FREE KEY DOES VERIFY ON BSC, AND THE REFUSAL IS INTERMITTENT
#
# Etherscan v2 puts `account`, `proxy` and `stats` behind a paid plan on chains
# 56 and 97. `contract` is not gated, and that includes `verifysourcecode`.
# The proof is on chain and re-checkable: `ToshLadderTreasury` at
# `0x79de…7674` is published on testnet.bscscan.com as `ToshLadderTreasury`,
# compiler `v0.8.26+commit.8a97fa7a`, submitted by this workflow on run 6 with
# the free key in repository secrets.
#
# But the SAME configuration, unchanged, was refused on run 7:
#
#     Free API access is not supported for this chain. Please upgrade your
#     api plan for full chain coverage.
#
# Runs 6 and 7 differ in nothing that this repository controls. So that
# message does not mean what it says — it is not a statement about the plan,
# because the plan verified a contract one run earlier.
#
# ── 2026-09-21: THE ABOVE IS ABOUT CHAIN 97, AND 56 BEHAVES DIFFERENTLY ─────
#
# Every run this file drew its theory from — 3, 6, 7, 8 — dispatched chain 97.
# The one success was `0x79de…7674` on testnet.bscscan.com, so "this key has
# published with this configuration" was never a statement about 56.
#
# Chain 56 has now been attempted: three runs on 2026-09-21, five contracts
# each, fifteen submissions, every one refused with the message above, and no
# success on that chain ever. Reads were unaffected throughout, exactly as on
# 97. An allowance that had been spent would have had to be spent before the
# first 56 submission ever landed.
#
# Etherscan's own documentation says "source code and ABI endpoints are
# available on all chains for every API plan, including the Free Tier", which
# reads like `verifysourcecode` should work. Third-party coverage tables list
# both 56 and 97 as Etherscan-paid-only. The two cannot both be right, and 97
# having published once says the tables are not right either. Nobody has
# settled it and this file should stop pretending it has.
#
# What is actionable does not depend on settling it. On 56, re-running is not
# the remedy the allowance theory implied it was: buy a plan, or use BscScan's
# web form, which takes no key and no plan; `node scripts/genVerifyInput.mjs`
# writes the upload package for every v2 contract into `verify-input/`.
#
# The original reading, kept because it is the correct reading FOR 97:
# a SUBMISSION ALLOWANCE. The shape of the evidence,
# across eight runs: the first submission that reached the endpoint succeeded,
# every submission after it was refused, four attempts 45 seconds apart on run
# 8 were refused identically, and `getsourcecode` reads never faltered once
# through any of it. A per-key allowance on a gated chain, spent, would look
# exactly like that. THIS IS INFERENCE, NOT MEASUREMENT — nobody has waited a
# day and tried again, which is the experiment that would settle it.
#
# The practical consequence is the useful part, and the steps below act on it:
# retrying within a run is futile, so the refusal fails fast with that reading
# attached rather than burning three minutes to arrive at it.
#
# Two earlier theories are recorded as wrong so they are not re-derived:
#
#   · "the gate is per action — reads free, writes paid". Held for one run.
#     Run 6 wrote.
#   · "the config path works and the command-line-flag path is refused",
#     drawn from run 3 (flags, refused) against run 6 (config, verified). Run
#     7 used the config path and was refused, so the flags were never the
#     variable.
#
# What follows from all of it, and is what the steps below are built on: the
# refusal is retryable, a run that ends red may still have published
# something, and the only trustworthy account of what is verified comes from
# asking the explorer afterwards rather than from `--watch`'s exit code.
#
# Two failures before that were mundane and are fixed in foundry.toml:
# Foundry does not add v2's `chainid` selector to a configured URL, so it has
# to be written into the URL beside a `chain` field that already names it.
#
# SOURCIFY IS NOT WIRED INTO THIS WORKFLOW, WHICH IS WORTH KNOWING BEFORE TRYING
#
# The v2 deployment on 56 IS on Sourcify — all 16 contracts, exact match — but
# it got there through Sourcify's own v2 API (`/server/v2/verify/56/{addr}`
# with the Standard JSON input), not through Foundry. This workflow briefly
# had a `verifier` input offering Sourcify through Foundry. It was removed
# because it did not work and it was not obvious that it did not work:
#
#   · `--verifier sourcify` is IGNORED by Foundry 1.7.1 while
#     `ETHERSCAN_API_KEY` is set in the environment. Not overridden with a
#     warning -- the warning it prints says "Unset it or pass `--verifier
#     sourcify`", and the second half of that sentence is not true in this
#     version. Run 6 passed the flag, was told Etherscan was being used
#     anyway, and submitted to BscScan with a GUID. An input that reports one
#     verifier and uses another is worse than no input.
#   · Unsetting the variable does not help: foundry.toml's `[etherscan]` table
#     interpolates it in all four entries, and that table is resolved whenever
#     the config is read, whoever the verifier is. Run 5 died on "environment
#     variable `ETHERSCAN_API_KEY` not found" while trying to use Sourcify.
#
# Sourcify does cover 56 and 97 -- checked, both present and `supported`
# in its list of 442 chains -- so the obstacle is Foundry's flag handling
# rather than coverage. It is also a worse target than BscScan for the purpose
# at hand, since BscScan is where a user actually looks a contract up.
# ─────────────────────────────────────────────────────────────────────────────

permissions: {}

on:
  workflow_dispatch:
    inputs:
      chain:
        description: Chain the contracts are deployed on
        required: true
        default: "56"
        type: choice
        options:
          - "56"
          - "97"
      script:
        description: Broadcast log to read the deployment out of
        required: true
        default: DeployV2.s.sol
        type: choice
        options:
          - DeployV2.s.sol
          - DeployLaunchGateway.s.sol

jobs:
  verify:
    name: Publish source to BscScan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      # Pinned to match CI. The compiler settings are part of what gets
      # verified: a different solc or a different optimizer run count produces
      # different bytecode and the explorer rejects the submission.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Build
        run: forge build --skip '*.t.sol'

      # Reads the deployment out of the broadcast artefact rather than a list
      # maintained here, so this workflow cannot name an address the deploy did
      # not produce. Same deploy `deployments/v2-56.json` records.
      - name: Verify every contract the deploy created
        env:
          # Consumed by foundry.toml's `[etherscan]` table, NOT passed to
          # `forge` as a flag. See the header: the flag path is the one that
          # got refused.
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BSC_RPC: ${{ secrets.BSC_RPC }}
          BSC_TESTNET_RPC: ${{ secrets.BSC_TESTNET_RPC }}
          CHAIN: ${{ inputs.chain }}
          SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail

          if [ -z "${ETHERSCAN_API_KEY:-}" ]; then
            echo "::error::ETHERSCAN_API_KEY is not set in repository secrets. foundry.toml interpolates it, so Foundry will fail to read its own config before it gets as far as verifying."
            exit 1
          fi

          log="broadcast/${SCRIPT}/${CHAIN}/run-latest.json"
          if [ ! -f "$log" ]; then
            echo "::error::${log} is not in the tree. Commit the broadcast artefact for this deployment, or check the chain and script inputs name the same deploy."
            exit 1
          fi

          if [ "$CHAIN" = "56" ]; then
            rpc="${BSC_RPC:-https://bsc-dataseed.bnbchain.org}"
          else
            rpc="${BSC_TESTNET_RPC:-https://data-seed-prebsc-1-s1.bnbchain.org:8545}"
          fi

          # ── What counts as "every contract the deploy created" ──────────────
          #
          # Every CREATE and CREATE2 the script broadcast, every contract a
          # constructor built (`additionalContracts`), and, for EVERY factory in
          # the log, the implementations read off its immutables. v2 deploys
          # one factory per quote asset, and each factory's constructor creates
          # its token implementation and its CircuitNFT, which creates the
          # revenue-vault implementation — 16 contracts on 56, five of them
          # never a transaction of their own.
          #
          # The getters are the cross-check for the log: an implementation the
          # factory uses but the log does not name still gets published, and a
          # name the log carries for an address the factory does not use is
          # still only what the deploy produced.
          targets="${RUNNER_TEMP:-/tmp}/verify-targets.tsv"
          jq -r '.transactions[]
            | select(.transactionType=="CREATE" or .transactionType=="CREATE2")
            | ([.contractName, .contractAddress],
               (.additionalContracts[]? | [.contractName, .address]))
            | select(.[0] != null)
            | @tsv' "$log" > "$targets"

          factories=$(jq -r '.transactions[]
            | select(.transactionType=="CREATE" and .contractName=="ToshFactory")
            | .contractAddress' "$log")

          if [ -z "$factories" ]; then
            echo "::warning::no ToshFactory in ${log}, so no implementations can be cross-checked"
          fi
          for factory in $factories; do
            for pair in "ToshLaunchpadHook:hookImplementation" "ToshToken:tokenImplementation" \
                        "CircuitNFT:circuitNFT" "CircuitRevenueVault:vaultImplementation"; do
              nm="${pair%%:*}"; getter="${pair##*:}"
              addr=$(cast call "$factory" "${getter}()(address)" --rpc-url "$rpc" | tr -d '[:space:]')
              case "$addr" in
                0x0000000000000000000000000000000000000000|"")
                  echo "::warning::factory ${factory} answered ${getter}() with '${addr:-<nothing>}'; ${nm} will not be published"
                  ;;
                *) printf '%s\t%s\n' "$nm" "$addr" >> "$targets" ;;
              esac
            done
          done
          # Lower-cased before de-duplicating: the log and `cast` disagree on
          # checksum casing, and a case-sensitive `sort -u` would keep both.
          awk -F'\t' '{ printf "%s\t%s\n", $1, tolower($2) }' "$targets" | sort -u -o "$targets"

          echo "contracts to publish:"
          sed 's/^/  /' "$targets"

          # Already-published addresses are skipped rather than resubmitted.
          # That is what makes re-running this safe after a partial failure,
          # which is the normal case given the intermittent refusal described
          # in the header -- and it is why run 7 was pure waste: it resubmitted
          # a contract that had been verified since run 6, and reported the
          # whole job red when nothing was actually missing but the factory.
          published() {
            local body
            body=$(curl -sS --get 'https://api.etherscan.io/v2/api' \
              --data-urlencode "chainid=${CHAIN}" \
              --data-urlencode 'module=contract' \
              --data-urlencode 'action=getsourcecode' \
              --data-urlencode "address=$1" \
              --data-urlencode "apikey=${ETHERSCAN_API_KEY}") || return 1
            [ -n "$(printf '%s' "$body" | jq -r '.result[0].ContractName // ""')" ]
          }

          # `--guess-constructor-args` takes the creation bytecode off the
          # chain and strips the locally compiled prefix, so a divergence
          # between this tree and what was deployed surfaces here instead of
          # as an opaque rejection. The broadcast log's recorded `arguments`
          # are a claim; the creation transaction is not.
          #
          # `--retries`/`--delay` govern Foundry's polling for a result it has
          # already submitted. The outer loop is a different thing: it retries
          # the SUBMISSION, which is what the intermittent tier refusal kills.
          # Both are needed and neither covers the other.
          failed=0
          first=1
          while IFS=$'\t' read -r name addr; do
            [ -n "$name" ] || continue
            [ "$first" = 1 ] || sleep 5
            first=0

            echo "::group::${name} at ${addr}"
            if published "$addr"; then
              echo "already published -- skipping"
              echo "::endgroup::"
              continue
            fi

            # `library` as well as `contract`: v1 deployed a linked library, and
            # a `contract`-only pattern made it unfindable. v2 links none, but a
            # deployed library verifies like any other address.
            src=$(grep -rl --include='*.sol' -E "^\s*(abstract\s+)?(contract|library)\s+${name}\b" src/ | head -n 1)
            if [ -z "$src" ]; then
              echo "::error::no source file under src/ declares contract or library ${name}"
              failed=1
              echo "::endgroup::"
              continue
            fi
            echo "source: ${src}"

            # Retries are for rate limits. They are NOT for the tier refusal,
            # which run 8 established is not transient within a run: four
            # attempts 45 seconds apart against the factory produced four
            # identical refusals, while the treasury -- already verified --
            # was skipped. Continuing to poke it just spends three minutes
            # arriving at the same place, so that message breaks the loop and
            # reports what it appears to mean instead.
            out=$(mktemp)
            ok=0
            budget=0
            for attempt in 1 2 3; do
              [ "$attempt" = 1 ] || { echo "-- retrying in 45s"; sleep 45; }
              set +e
              forge verify-contract "$addr" "${src}:${name}" \
                --chain "$CHAIN" \
                --rpc-url "$rpc" \
                --guess-constructor-args \
                --retries 10 \
                --delay 20 \
                --watch > "$out" 2>&1
              rc=$?
              set -e
              cat "$out"
              [ "$rc" = 0 ] && { ok=1; break; }

              # The submission can land even when the command reports failure:
              # that is what happened to the factory on run 6, where only the
              # status poll was rate-limited.
              if published "$addr"; then
                echo "the command failed but the source is published anyway"
                ok=1
                break
              fi

              if grep -q 'Free API access is not supported' "$out"; then
                budget=1
                break
              fi
            done

            if [ "$ok" = 1 ]; then
              echo "verified: ${name}"
            elif [ "$budget" = 1 ]; then
              echo "::error::${name} at ${addr} was refused with \"Free API access is not supported for this chain\" on chain ${CHAIN}. On 97 this key has published (run 6), so there the message is not a plan boundary and re-running later is worth a try. On 56 it has never published: 15 submissions across three runs on 2026-09-21, all refused, while reads were unaffected throughout -- which is what a plan boundary looks like and not what an allowance looks like. So on 56 do not just re-run. Either buy an Etherscan plan that covers BSC, or publish through BscScan's web form, which has no key and no plan; node scripts/genVerifyInput.mjs writes the Standard JSON Input and constructor arguments for each contract into verify-input/."
              failed=1
            else
              echo "::error::verification failed for ${name} at ${addr} after 3 attempts -- see the output above; this is not the tier refusal."
              failed=1
            fi
            rm -f "$out"
            echo "::endgroup::"
          done < "$targets"

          exit "$failed"

      # Independent read-back, and `if: always()` so a partial success is
      # reported as one. `forge verify-contract --watch` succeeding is
      # Foundry's account of what the explorer told it; this asks the explorer
      # directly, which is the difference between "the submission was
      # accepted" and "the source is published". Run 6 needed exactly that
      # distinction: one contract verified, one submitted-then-rate-limited.
      #
      # `getsourcecode` is a READ, and reads are the half of `module=contract`
      # that was never in doubt on the free tier.
      - name: Confirm it is actually published
        if: always()
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          CHAIN: ${{ inputs.chain }}
          SCRIPT: ${{ inputs.script }}
        run: |
          set -uo pipefail
          log="broadcast/${SCRIPT}/${CHAIN}/run-latest.json"
          [ -f "$log" ] || exit 0
          if [ "$CHAIN" = "56" ]; then host=bscscan.com; else host=testnet.bscscan.com; fi

          # The same list the publishing step worked from, so this reports on
          # what was actually attempted. It is written there; regenerate it
          # here only if that step died before getting that far, in which case
          # the broadcast log is all there is: no getter cross-check, but the
          # constructor-built contracts are still named in it.
          targets="${RUNNER_TEMP:-/tmp}/verify-targets.tsv"
          if [ ! -s "$targets" ]; then
            echo "(the publishing step did not get as far as resolving its targets)"
            jq -r '.transactions[]
              | select(.transactionType=="CREATE" or .transactionType=="CREATE2")
              | ([.contractName, .contractAddress],
                 (.additionalContracts[]? | [.contractName, .address]))
              | select(.[0] != null)
              | @tsv' "$log" > "$targets"
          fi

          while IFS=$'\t' read -r name addr; do
            [ -n "$name" ] || continue
            sleep 1
            body=$(curl -sS --get 'https://api.etherscan.io/v2/api' \
              --data-urlencode "chainid=${CHAIN}" \
              --data-urlencode 'module=contract' \
              --data-urlencode 'action=getsourcecode' \
              --data-urlencode "address=${addr}" \
              --data-urlencode "apikey=${ETHERSCAN_API_KEY}")
            cname=$(printf '%s' "$body" | jq -r '.result[0].ContractName // ""')
            compiler=$(printf '%s' "$body" | jq -r '.result[0].CompilerVersion // ""')
            if [ -n "$cname" ]; then
              echo "  ${name}: PUBLISHED as ${cname}, compiler ${compiler}"
              if [ "$cname" != "$name" ]; then
                echo "::warning::${addr} is verified as ${cname} but the broadcast log calls it ${name}"
              fi
            else
              echo "  ${name}: not published"
            fi
            echo "    https://${host}/address/${addr}#code"
          done < "$targets"
