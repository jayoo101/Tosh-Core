name: Verify deployment

# Manual only. Verification is not idempotent in a useful way -- a second run
# against an already-verified address answers "already verified" and costs a
# call -- and it needs a credential, so it does not belong on push.
#
# WHY THIS RUNS HERE AND NOT ON A LAPTOP
#
# `ETHERSCAN_API_KEY` lives in repository secrets and nowhere else. Running
# `forge verify-contract` locally means first copying that key into a dotenv,
# which is the plaintext-at-rest state `checkSecretStore.mjs` exists to
# report. A workflow reads the secret into a process and never writes it down.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE FREE KEY DOES VERIFY ON BSC, AND THE REFUSAL IS INTERMITTENT
#
# Etherscan v2 puts `account`, `proxy` and `stats` behind a paid plan on chains
# 56 and 97. `contract` is not gated, and that includes `verifysourcecode`.
# The proof is on chain and re-checkable: `ToshLadderTreasury` at
# `0x79de…7674` is published on testnet.bscscan.com as `ToshLadderTreasury`,
# compiler `v0.8.26+commit.8a97fa7a`, submitted by this workflow on run 6 with
# the free key in repository secrets.
#
# But the SAME configuration, unchanged, was refused on run 7:
#
#     Free API access is not supported for this chain. Please upgrade your
#     api plan for full chain coverage.
#
# Runs 6 and 7 differ in nothing that this repository controls. So that
# message does not mean what it says — it is not a statement about the plan,
# because the plan verified a contract one run earlier. The most likely
# reading is load-shedding wearing a tier error's clothes, and run 6 supports
# it from the other side by also producing an honest "Max calls per sec rate
# limit reached (3/sec)". THIS IS NOT ESTABLISHED, only consistent.
#
# Two earlier theories are recorded as wrong so they are not re-derived:
#
#   · "the gate is per action — reads free, writes paid". Held for one run.
#     Run 6 wrote.
#   · "the config path works and the command-line-flag path is refused",
#     drawn from run 3 (flags, refused) against run 6 (config, verified). Run
#     7 used the config path and was refused, so the flags were never the
#     variable.
#
# What follows from all of it, and is what the steps below are built on: the
# refusal is retryable, a run that ends red may still have published
# something, and the only trustworthy account of what is verified comes from
# asking the explorer afterwards rather than from `--watch`'s exit code.
#
# Two failures before that were mundane and are fixed in foundry.toml:
# Foundry does not add v2's `chainid` selector to a configured URL, so it has
# to be written into the URL beside a `chain` field that already names it.
#
# SOURCIFY IS NOT AN OPTION HERE, WHICH IS WORTH KNOWING BEFORE TRYING
#
# This workflow briefly had a `verifier` input offering Sourcify as a
# no-account alternative. It was removed because it did not work and it was
# not obvious that it did not work:
#
#   · `--verifier sourcify` is IGNORED by Foundry 1.7.1 while
#     `ETHERSCAN_API_KEY` is set in the environment. Not overridden with a
#     warning -- the warning it prints says "Unset it or pass `--verifier
#     sourcify`", and the second half of that sentence is not true in this
#     version. Run 6 passed the flag, was told Etherscan was being used
#     anyway, and submitted to BscScan with a GUID. An input that reports one
#     verifier and uses another is worse than no input.
#   · Unsetting the variable does not help: foundry.toml's `[etherscan]` table
#     interpolates it in all four entries, and that table is resolved whenever
#     the config is read, whoever the verifier is. Run 5 died on "environment
#     variable `ETHERSCAN_API_KEY` not found" while trying to use Sourcify.
#
# Sourcify does cover 56 and 97 -- checked, both present and `supported`
# in its list of 442 chains -- so the obstacle is Foundry's flag handling
# rather than coverage. It is also a worse target than BscScan for the purpose
# at hand, since BscScan is where a user actually looks a contract up.
# ─────────────────────────────────────────────────────────────────────────────

permissions: {}

on:
  workflow_dispatch:
    inputs:
      chain:
        description: Chain the contracts are deployed on
        required: true
        default: "97"
        type: choice
        options:
          - "97"
          - "56"
      script:
        description: Broadcast log to read the deployment out of
        required: true
        default: Deploy.s.sol
        type: choice
        options:
          - Deploy.s.sol
          - DeployMainnet.s.sol

jobs:
  verify:
    name: Publish source to BscScan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      # Pinned to match CI. The compiler settings are part of what gets
      # verified: a different solc or a different optimizer run count produces
      # different bytecode and the explorer rejects the submission.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Build
        run: forge build --skip '*.t.sol'

      # Reads the deployment out of the broadcast artefact rather than a list
      # maintained here, so this workflow cannot name an address the deploy did
      # not produce. Same artefact SECURITY.md cites as the provenance anchor.
      - name: Verify every contract the deploy created
        env:
          # Consumed by foundry.toml's `[etherscan]` table, NOT passed to
          # `forge` as a flag. See the header: the flag path is the one that
          # got refused.
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BSC_RPC: ${{ secrets.BSC_RPC }}
          BSC_TESTNET_RPC: ${{ secrets.BSC_TESTNET_RPC }}
          CHAIN: ${{ inputs.chain }}
          SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail

          if [ -z "${ETHERSCAN_API_KEY:-}" ]; then
            echo "::error::ETHERSCAN_API_KEY is not set in repository secrets. foundry.toml interpolates it, so Foundry will fail to read its own config before it gets as far as verifying."
            exit 1
          fi

          log="broadcast/${SCRIPT}/${CHAIN}/run-latest.json"
          if [ ! -f "$log" ]; then
            echo "::error::${log} is not in the tree. Commit the broadcast artefact for this deployment, or pick the other script input."
            exit 1
          fi

          if [ "$CHAIN" = "56" ]; then
            rpc="${BSC_RPC:-https://bsc-dataseed.bnbchain.org}"
          else
            rpc="${BSC_TESTNET_RPC:-https://data-seed-prebsc-1-s1.bnbchain.org:8545}"
          fi

          # Already-published addresses are skipped rather than resubmitted.
          # That is what makes re-running this safe after a partial failure,
          # which is the normal case given the intermittent refusal described
          # in the header -- and it is why run 7 was pure waste: it resubmitted
          # a contract that had been verified since run 6, and reported the
          # whole job red when nothing was actually missing but the factory.
          published() {
            local body
            body=$(curl -sS --get 'https://api.etherscan.io/v2/api' \
              --data-urlencode "chainid=${CHAIN}" \
              --data-urlencode 'module=contract' \
              --data-urlencode 'action=getsourcecode' \
              --data-urlencode "address=$1" \
              --data-urlencode "apikey=${ETHERSCAN_API_KEY}") || return 1
            [ -n "$(printf '%s' "$body" | jq -r '.result[0].ContractName // ""')" ]
          }

          # `--guess-constructor-args` takes the creation bytecode off the
          # chain and strips the locally compiled prefix, so a divergence
          # between this tree and what was deployed surfaces here instead of
          # as an opaque rejection. The broadcast log's recorded `arguments`
          # are a claim; the creation transaction is not.
          #
          # `--retries`/`--delay` govern Foundry's polling for a result it has
          # already submitted. The outer loop is a different thing: it retries
          # the SUBMISSION, which is what the intermittent tier refusal kills.
          # Both are needed and neither covers the other.
          failed=0
          first=1
          while IFS=$'\t' read -r name addr; do
            [ -n "$name" ] || continue
            [ "$first" = 1 ] || sleep 5
            first=0

            echo "::group::${name} at ${addr}"
            if published "$addr"; then
              echo "already published -- skipping"
              echo "::endgroup::"
              continue
            fi

            src=$(grep -rl --include='*.sol' -E "^\s*(abstract\s+)?contract\s+${name}\b" src/ | head -n 1)
            if [ -z "$src" ]; then
              echo "::error::no source file under src/ declares contract ${name}"
              failed=1
              echo "::endgroup::"
              continue
            fi
            echo "source: ${src}"

            ok=0
            for attempt in 1 2 3 4; do
              [ "$attempt" = 1 ] || { echo "-- attempt ${attempt} after 45s"; sleep 45; }
              if forge verify-contract "$addr" "${src}:${name}" \
                   --chain "$CHAIN" \
                   --rpc-url "$rpc" \
                   --guess-constructor-args \
                   --retries 10 \
                   --delay 20 \
                   --watch; then
                ok=1
                break
              fi
              # Cheap out: the submission may have landed even though the
              # command reported failure, which is precisely what happened to
              # the factory on run 6.
              if published "$addr"; then
                echo "the command failed but the source is published anyway"
                ok=1
                break
              fi
            done

            if [ "$ok" = 1 ]; then
              echo "verified: ${name}"
            else
              echo "::error::verification failed for ${name} at ${addr} after 4 attempts"
              failed=1
            fi
            echo "::endgroup::"
          done < <(jq -r '.transactions[] | select(.transactionType=="CREATE") | select(.contractName != null) | [.contractName, .contractAddress] | @tsv' "$log")

          exit "$failed"

      # Independent read-back, and `if: always()` so a partial success is
      # reported as one. `forge verify-contract --watch` succeeding is
      # Foundry's account of what the explorer told it; this asks the explorer
      # directly, which is the difference between "the submission was
      # accepted" and "the source is published". Run 6 needed exactly that
      # distinction: one contract verified, one submitted-then-rate-limited.
      #
      # `getsourcecode` is a READ, and reads are the half of `module=contract`
      # that was never in doubt on the free tier.
      - name: Confirm it is actually published
        if: always()
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          CHAIN: ${{ inputs.chain }}
          SCRIPT: ${{ inputs.script }}
        run: |
          set -uo pipefail
          log="broadcast/${SCRIPT}/${CHAIN}/run-latest.json"
          [ -f "$log" ] || exit 0
          if [ "$CHAIN" = "56" ]; then host=bscscan.com; else host=testnet.bscscan.com; fi

          while IFS=$'\t' read -r name addr; do
            [ -n "$name" ] || continue
            sleep 1
            body=$(curl -sS --get 'https://api.etherscan.io/v2/api' \
              --data-urlencode "chainid=${CHAIN}" \
              --data-urlencode 'module=contract' \
              --data-urlencode 'action=getsourcecode' \
              --data-urlencode "address=${addr}" \
              --data-urlencode "apikey=${ETHERSCAN_API_KEY}")
            cname=$(printf '%s' "$body" | jq -r '.result[0].ContractName // ""')
            compiler=$(printf '%s' "$body" | jq -r '.result[0].CompilerVersion // ""')
            if [ -n "$cname" ]; then
              echo "  ${name}: PUBLISHED as ${cname}, compiler ${compiler}"
              if [ "$cname" != "$name" ]; then
                echo "::warning::${addr} is verified as ${cname} but the broadcast log calls it ${name}"
              fi
            else
              echo "  ${name}: not published"
            fi
            echo "    https://${host}/address/${addr}#code"
          done < <(jq -r '.transactions[] | select(.transactionType=="CREATE") | select(.contractName != null) | [.contractName, .contractAddress] | @tsv' "$log")
