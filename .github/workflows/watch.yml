# The scheduler and sink for PM-E2. `monitoring/watch.mjs` was built run-once
# precisely so the host could be decided later; this is that decision.
#
# Findings are pushed to a pager as of 2026-09-11, and the schedule underneath
# is still best-effort — GitHub delivered 27% of the passes the hourly cron
# asked for over the 157 hours it was measured across. Delivery was the half
# that could be fixed from here. Cadence is not.
#
# Re-measured 2026-09-13, after the cadence below went to every 15 minutes:
# 52 scheduled runs over 193.5 h against an expected 774, so 7%. The rate is the
# number to read, not the percentage — 0.269 passes/hour, against 0.27/hour at
# the hourly cron. Asking four times as often delivered the same ~6.5 passes a
# day. So the interval is not a detection knob on this host; it is inert, and
# §7.3's hope that "a shorter interval buys more chances" is answered: it bought
# none. Observed gaps between passes ran 2.1 h at the closest and 7.2 h at the
# widest. `WATCHER-05` in `monitoring/watch.mjs` now reports the gap on every
# pass, because until it did, the only failure mode this host has was invisible
# from inside it.
#
# The `schedule:` interval is therefore leftover best-effort, not a detection
# bound. Tightening it again will not move 0.269. The bound is the interval of
# whatever hits `repository_dispatch` via `/api/watch-ping` — a host that is
# not this pool. Vercel Hobby can only cron that route daily; a 15-minute bar
# needs an external pinger (cron-job.org or `scripts/pingWatch.mjs`).

name: Watch

permissions: {}

on:
  # Offset from the hour on purpose. Scheduled workflows queue on a shared
  # pool, `0 * * * *` is the busiest slot on it, and GitHub's own guidance is
  # that schedules are best-effort — delays of tens of minutes are routine and
  # runs can be dropped outright under load. Odd minutes are measurably less
  # contended. This does NOT make the cadence a guarantee; see §7.3.
  #
  # Was hourly, chosen 2026-09-04 as a budget decision rather than a detection
  # one: a pass costs one billed minute, and against a PRIVATE repository's
  # allowance twice an hour was ~1,440 min/month competing with `test.yml`
  # (4.4 min per push) and `frontend.yml` (2.4 min).
  #
  # That constraint went away on 2026-09-11, when the repository was published.
  # Actions minutes are free on public repositories, so the reason for hourly no
  # longer exists and the cadence goes to every 15 minutes — which is what
  # `alerts.json` says three of the state checks warrant, and four times more
  # often than STATE-07 was being asked the one question that guards the
  # unbounded-buyback residual in SECURITY.md.
  #
  # This still does not make the cadence a guarantee: scheduled workflows are
  # best-effort, delays of tens of minutes are routine, and a 15-minute
  # detection bar is NOT met by this host at any cron setting. What closes
  # that is the pager, not the frequency. Minutes offset from the hour on
  # purpose — `0 * * * *` is the busiest slot on the shared pool and odd
  # minutes are measurably less contended.
  schedule:
    - cron: '7,22,37,52 * * * *'

  workflow_dispatch:
    inputs:
      since:
        description: 'Rescan the last N blocks instead of resuming from the checkpoint'
        type: string
      dry:
        description: 'Scan and print only — file no issues, persist no checkpoint'
        type: boolean
        default: false

  # GitHub's own schedule delivered 0.269 passes/hour against a cron asking
  # for four. Tightening the interval bought nothing. This event is how a
  # host that is not GitHub's scheduler — Vercel cron, cron-job.org, a
  # laptop — starts the same job. `/api/watch-ping` is the public button.
  repository_dispatch:
    types: [watch]

# Two passes must not interleave: both would resume from the same checkpoint,
# scan the same window, and race to push it back — duplicate findings, and
# whichever push lands second decides where the next pass starts.
#
# Queued rather than cancelled. `cancel-in-progress: true` would be actively
# harmful here: the cancelled pass has already read a window and would die
# before persisting it, so its blocks are scanned by nobody.
concurrency:
  group: watch
  cancel-in-progress: false

env:
  STATE_BRANCH: watcher-state

jobs:
  watch:
    name: On-chain watcher
    runs-on: ubuntu-latest

    permissions:
      # The checkpoint lives on its own branch, so this job can write to the
      # repository. It is the price of durable state without a database. The
      # branch holds one generated file and nothing reads it but this workflow.
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # `watch.mjs` derives every function selector with `cast sig` rather than
      # typing constants, because a wrong selector reverts and a revert is
      # indistinguishable from the function having been removed — a state check
      # crying wolf about the thing it exists to watch. That design choice is
      # why this job needs Foundry at all. Pinned to match test.yml.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      # Every runner is fresh and `monitoring/.watch-state*.json` is gitignored,
      # so the checkpoint has to come from somewhere outside the checkout: a
      # one-file orphan branch. Without it the watcher falls back to scanning
      # MONITOR_MAX_SPAN — 900k blocks, about 25 h at this chain's 100 ms blocks
      # — and reports the lot as new.
      #
      # Which is why a cold start is bounded here rather than left to that
      # fallback. Replaying a day of history into the issue tracker is not
      # monitoring; those events are already over, and nobody learns about
      # yesterday's incident from an alert stream switched on today. The first
      # pass therefore looks back COLD_START_BLOCKS and says so in the log. The
      # window before that is genuinely unscanned, and saying which window that
      # was is the difference between a bounded start and a silent gap.
      - name: Restore the block checkpoint
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLD_START_BLOCKS: '5000'
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/state"
          if git clone --quiet --depth 1 --branch "$STATE_BRANCH" \
               "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
               "$STATE_DIR" 2>/dev/null; then
            cp "$STATE_DIR/.watch-state.json" monitoring/.watch-state.json
            echo "resumed from block $(node -p "require('$STATE_DIR/.watch-state.json').lastBlock")"
          else
            echo "cold=$COLD_START_BLOCKS" >> "$GITHUB_OUTPUT"
            echo "::notice::No '$STATE_BRANCH' branch yet, so there is no checkpoint. Starting cold, bounded to the last $COLD_START_BLOCKS blocks. Anything older than that is NOT scanned by this pass and never will be — run the workflow manually with a larger 'since' if you need to sweep it."
          fi

      - name: Scan
        id: scan
        env:
          # Addresses are repository VARIABLES, not secrets: they are public on
          # chain, and a monitor whose target is secret cannot be reviewed. The
          # endpoint is a secret because it may carry a key.
          #
          # MONITOR_RPC first, BSC_TESTNET_RPC only as a fallback.
          #
          # This order was briefly INVERTED, and the reason is worth keeping
          # because the inversion was correct at the time and wrong hours later.
          # On 2026-09-18 MONITOR_RPC held a paid dRPC Growth key for chain 4663 —
          # right capability, retired chain — and BSC_TESTNET_RPC held the public
          # dataseed, which is the right chain but does not serve eth_getLogs at
          # all (measured; see the BSC section in monitoring/rpc.mjs). Preferring
          # the dataseed was the better of two bad options: eth_call is served, so
          # the STATE-* checks and the ownership reads ran and only the log-based
          # alerts were missing, loudly, via WATCHER-02 and WATCHER-04.
          #
          # MONITOR_RPC was then repointed at a keyed chain-97 endpoint, at which
          # point the fallback became the thing holding the monitor half-blind:
          # BSC_TESTNET_RPC is still the dataseed, `||` takes the first non-empty
          # value, and a run after the repoint reported 0/3 getLogs exactly as
          # before. A precedence written for one state of the secrets is a silent
          # regression in the next, which is the same failure mode as the stale
          # catalogue WATCHER-08 exists for.
          #
          # The invariant to preserve: whichever endpoint is named must be chain
          # 97 and must serve eth_getLogs. WATCHER-07 catches the first if this
          # ever falls back to a 4663 URL; WATCHER-02 and -04 catch the second.
          # Neither is silent, so a wrong order here costs a pass, not a month.
          MONITOR_RPC: ${{ secrets.MONITOR_RPC || secrets.BSC_TESTNET_RPC }}
          MONITOR_FACTORY: ${{ vars.MONITOR_FACTORY }}
          MONITOR_TREASURY: ${{ vars.MONITOR_TREASURY }}
          MONITOR_EXPECTED_OWNER: ${{ vars.MONITOR_EXPECTED_OWNER }}
          MONITOR_EXPECTED_POG_SIGNER: ${{ vars.MONITOR_EXPECTED_POG_SIGNER }}
          MONITOR_KEEPER_ADDRESS: ${{ vars.MONITOR_KEEPER_ADDRESS }}
          # WATCHER-05's threshold, in minutes. A variable rather than a
          # constant because the right value depends on which host is actually
          # delivering passes, and that is an operational measurement rather
          # than a code fact. Unset expands to '' and watch.mjs falls back to
          # 480 — above the widest gap GitHub's scheduler has been observed to
          # produce. Set to 60 on 2026-09-14, once the external pinger had been
          # measured holding 15 min; see the WATCHER-05 block in watch.mjs.
          MONITOR_MAX_RUN_GAP_MIN: ${{ vars.MONITOR_MAX_RUN_GAP_MIN }}
          # Through the environment, never interpolated into the script body.
          # `${{ inputs.since }}` expanded inline is a shell injection from a
          # field anyone with write access can type into.
          SINCE: ${{ inputs.since }}
          DRY: ${{ inputs.dry }}
          COLD: ${{ steps.state.outputs.cold }}
        run: |
          set -uo pipefail
          # An explicit `since` from a human wins over the cold-start bound;
          # sweeping a known gap is the reason that input exists.
          window="${SINCE:-${COLD:-}}"

          # `if`, not `[ … ] && …`. GitHub runs every step as `bash -e {0}`, and
          # under -e an `&&` list whose test is FALSE returns 1 and kills the
          # step. That is the normal case here, not an edge one: on any resumed
          # pass `window` is empty and `dry` is false, so both lines would be
          # false and a healthy scheduled run would die before scanning
          # anything. It only survived testing because the first manual run
          # passed a `since`.
          args=()
          if [ -n "$window" ]; then args+=(--since "$window"); fi
          if [ "${DRY:-false}" = "true" ]; then args+=(--dry); fi

          # Same -e, opposite problem. `set -uo pipefail` does not clear the -e
          # that GitHub put on the command line, so watch.mjs exiting 1 aborted
          # the step before `code=$?` could read it — turning "a finding paged"
          # into a red build, which is exactly what the comment below says this
          # must not do.
          set +e
          node monitoring/watch.mjs "${args[@]}" > "$RUNNER_TEMP/findings.jsonl"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

          # 2 is "you configured me wrong" — no factory address, or a checkpoint
          # that will not parse. Nothing was scanned, so this must be red.
          if [ "$code" -eq 2 ]; then
            echo "::error::The watcher could not run. It scanned nothing this pass — this is not a quiet chain, it is a blind monitor. Check MONITOR_FACTORY / MONITOR_TREASURY and the state branch."
            exit 1
          fi

          # 1 is "something paged", which usually means the watcher worked.
          # Deliberately NOT a job failure in that case: the alert is the issue
          # it files, and a red X on every real incident teaches people that
          # red means nothing.
          #
          # Exception: WATCHER-04. That is "started, scanned nothing" — the
          # same claim as exit 2, reached by a different door. Workflow run
          # 34196807435 (2026-09-08 mainnet cutover) is why this branch exists.
          # Every eth_getLogs 429'd; WATCHER-02 was page:false; the one paging
          # finding was WATCHER-03 (the expected cutover notice); this step
          # printed "watcher exited 1" and stayed green. The ::error:: above
          # did not fire because the process exited 1, not 2. Independently
          # the same window held seven P0 governance logs. A fully blind pass
          # must be red here AND still file the finding (see the next step's
          # `always()`), so the issue tracker and the Actions X both fire.
          echo "watcher exited $code ($(wc -l < "$RUNNER_TEMP/findings.jsonl") finding(s))"
          if grep -q '"id":"WATCHER-04"' "$RUNNER_TEMP/findings.jsonl" 2>/dev/null; then
            echo "::error::The watcher could not run. It scanned nothing this pass — this is not a quiet chain, it is a blind monitor."
            exit 1
          fi

      # `always()` is load-bearing in the other direction from the usual
      # `success()` guard. Exit 2 (could not start) must not file: there is
      # nothing to file. WATCHER-04 (started, scanned nothing) MUST file —
      # that is the page — even though the scan step is now red. `success()`
      # alone is why run 34196807435 could have stayed silent on a WATCHER-04
      # if we had only turned the job red. Cancelled runs and dry runs still
      # skip. A crash before `code=` is written is treated as not-2, and
      # report.mjs is a no-op on an empty file.
      # The filing token's expiry is documented three ways below: in prose, in
      # the persist step's guard, and here as a value something can act on. Only
      # the last one can warn BEFORE it bites. Without it the whole design works
      # but you learn about the lapse on the day it costs you a window: filing
      # 401s, the job goes red, the checkpoint holds, and the next pass after a
      # rotation rescans. That is safe and it is loud, and it is still three
      # weeks later than the moment you could have acted.
      #
      # This step now FAILS when the date has passed. Until 2026-09-13 it only
      # annotated, so a scheduled run stayed green through expiry and the next
      # filing 401 just stopped writing findings — which reads as "nothing to
      # report". A second red on a run that is about to 401 anyway is the
      # cheaper of the two mistakes.
      #
      # The date lives in `monitoring/alert-token-expires`, not here. Rotating
      # the PAT means updating that file in the same commit. GitHub exposes no
      # API for a fine-grained token's expiry, so this is a hand-kept mirror.
      # A stale date fails early, which is annoying and visible rather than quiet.
      - name: Check how long the alert-filing token has left
        if: ${{ always() && !cancelled() && inputs.dry != true }}
        env:
          TOKEN_PRESENT: ${{ secrets.ALERT_REPO_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$TOKEN_PRESENT" != "true" ]; then
            echo "ALERT_REPO_TOKEN is unset, so filing uses the built-in GITHUB_TOKEN."
            echo "That one is minted per run and cannot expire. Nothing to watch here."
            exit 0
          fi
          # Named explicitly: the guard above is about THIS token, and the
          # other date the script knows about belongs to a Vercel variable
          # this job never reads.
          node scripts/checkTokenExpiry.mjs ALERT_REPO_TOKEN

      - name: File findings as issues
        id: file
        if: ${{ always() && !cancelled() && inputs.dry != true && steps.scan.outputs.code != '2' }}
        env:
          # `ALERT_REPO` and `ALERT_REPO_TOKEN` send findings to a private
          # repository instead of this one. They exist because this repository
          # went public on 2026-09-11 and the issue tracker went public with
          # it — issues are not code and show up in no diff, which is why that
          # consequence is easy to miss. A watcher filing here publishes the
          # protocol's weak state at the moment it is weakest, and STATE-07 is
          # the sharp case: it fires during the residual unbounded-buyback
          # window disclosed in SECURITY.md, and alerts.json is public too, so
          # the alert would supply the timing and the repository the method.
          #
          # The sink's NAME is a secret, not a `vars` variable. On a public
          # repository a variable would advertise that a private sink exists
          # and what it is called, which is the single thing it must not do.
          #
          # Both unset, this is byte-for-byte the old behaviour: the built-in
          # token, this repository. Forks and local `--dry` need no setup.
          #
          # ALERT_REPO_TOKEN is a fine-grained PAT on jayoo101/tosh-alerts with
          # Issues: read and write and Metadata: read — exactly the five calls
          # report.mjs makes and nothing else. Issued 2026-09-11 for 90 days, so
          # it expires on the date in `monitoring/alert-token-expires`. On that
          # day this job goes red — first from the expiry check, then from
          # `delivery failed: GET /repos/… → 401` — and stops persisting the
          # checkpoint. Rotate the token, rewrite that file, and the pass that
          # follows rescans the window it skipped.
          GITHUB_TOKEN: ${{ secrets.ALERT_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          WATCH_ISSUE_REPO: ${{ secrets.ALERT_REPO }}
          # The push half of PM-E2. Unset, `report.mjs` files issues exactly as
          # before and says on every pass that nobody is being woken.
          #
          # Set, an unacknowledged P0 pages on EVERY pass until its issue is
          # closed or labelled `acked` — so at this cron, every 15 minutes.
          # That is deliberate and it is the thing that makes it a pager rather
          # than a notification, but it also means a P0 nobody silences will
          # keep arriving. Silencing it is one label.
          PAGER_TELEGRAM_TOKEN: ${{ secrets.PAGER_TELEGRAM_TOKEN }}
          PAGER_TELEGRAM_CHAT: ${{ secrets.PAGER_TELEGRAM_CHAT }}
          WATCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node monitoring/report.mjs "$RUNNER_TEMP/findings.jsonl"

      # Same `always()` as filing: a WATCHER-04 pass does not advance
      # lastBlock (watch.mjs keeps the previous checkpoint) but does rewrite
      # lastRun. Persisting that is how the next pass retries the same
      # window. `success()` would skip the write and leave the runner-temp
      # copy to die with the job, which is a different way to lose the
      # window if a previous persist had already moved lastBlock.
      #
      # `steps.file.outcome != 'failure'` added 2026-09-11 alongside
      # `ALERT_REPO_TOKEN`. A checkpoint that advances past findings nobody
      # filed loses them from the resume path entirely, and `--since` is the
      # only way back. That could not really happen while the sink was this
      # repository: `secrets.GITHUB_TOKEN` is minted per run and cannot expire
      # mid-job. A fine-grained PAT can and eventually will, and its expiry
      # looks like this — filing throws, the job goes red, and the window it
      # covered is consumed anyway. Not persisting is the safe direction: the
      # state branch keeps the older checkpoint and the next pass rescans.
      - name: Persist the block checkpoint
        if: ${{ always() && !cancelled() && inputs.dry != true && steps.scan.outputs.code != '2' && steps.file.outcome != 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/state"
          if [ ! -d "$STATE_DIR/.git" ]; then
            mkdir -p "$STATE_DIR"
            git -C "$STATE_DIR" init --quiet
            git -C "$STATE_DIR" checkout --quiet --orphan "$STATE_BRANCH"
            git -C "$STATE_DIR" remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          cp monitoring/.watch-state.json "$STATE_DIR/.watch-state.json"

          # Every checkpoint push made Vercel attempt a Preview build of this
          # branch, and every one of them failed: the branch holds a state file
          # and no application. ~6.5 failed deployments a day, and the cost is
          # not the build minutes — it is that a permanent stream of expected
          # deployment failures is how a real one stops being noticed.
          #
          # `git.deploymentEnabled` has to be present ON the branch being pushed
          # to be consulted (vercel/vercel#11176 — an orphan `gh-pages` branch,
          # the same shape as this one). Written to both paths on purpose: the
          # project's Root Directory is `soat-frontend`, which is where Vercel
          # documents vercel.json living, and reports differ on which path a
          # pre-build check reads. Two lines beats guessing, because guessing
          # wrong here fails silently — the deployments simply keep failing.
          printf '{"git":{"deploymentEnabled":false}}\n' > "$STATE_DIR/vercel.json"
          mkdir -p "$STATE_DIR/soat-frontend"
          cp "$STATE_DIR/vercel.json" "$STATE_DIR/soat-frontend/vercel.json"

          git -C "$STATE_DIR" config user.name  'tosh-watcher'
          git -C "$STATE_DIR" config user.email 'watcher@users.noreply.github.com'
          git -C "$STATE_DIR" add .watch-state.json vercel.json soat-frontend/vercel.json
          if git -C "$STATE_DIR" diff --cached --quiet; then
            echo 'checkpoint unchanged'
            exit 0
          fi
          git -C "$STATE_DIR" commit --quiet \
            -m "checkpoint $(node -p "require('$STATE_DIR/.watch-state.json').lastBlock")"
          git -C "$STATE_DIR" push --quiet origin "HEAD:$STATE_BRANCH"

      # The run log is the only place the non-paging findings and the "ran but
      # could not check" gaps appear, and nobody opens a green run's log.
      - name: Summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo '### On-chain watcher'
            echo
            if [ -s "$RUNNER_TEMP/findings.jsonl" ]; then
              echo '| id | severity | pages | message |'
              echo '|---|---|---|---|'
              node -e '
                const fs = require("fs")
                for (const l of fs.readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean)) {
                  const f = JSON.parse(l)
                  const m = f.message.replace(/\|/g, "\\|").slice(0, 160)
                  console.log(`| ${f.id} | ${f.severity} | ${f.page ? "yes" : "no"} | ${m} |`)
                }
              ' "$RUNNER_TEMP/findings.jsonl"
            else
              echo 'No findings this pass.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
